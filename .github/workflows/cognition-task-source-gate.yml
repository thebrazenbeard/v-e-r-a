name: cognition-task-source-gate

on:
  push:
    branches:
      - integration/cognition-task-source-gate-v1-20261016
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Integration subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: v-e-r-a
      - name: Checkout exact Vera Mono task ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thebrazenbeard/vera-mono
          ref: dec5c029e51c4fd436435cbda7e02e501822ee85
          path: vera-mono
          persist-credentials: false
      - name: Checkout exact Training peer contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thebrazenbeard/model-training
          ref: 93e302c4efabec270a8baa53d4ab62d66a77b964
          path: model-training
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install standalone source-test dependency
        run: python -m pip install "jsonschema>=4.22,<5"
      - name: Exact Git subject readback
        shell: bash
        run: |
          test "$(git -C vera-mono rev-parse HEAD)" = "dec5c029e51c4fd436435cbda7e02e501822ee85"
          test "$(git -C model-training rev-parse HEAD)" = "93e302c4efabec270a8baa53d4ab62d66a77b964"
          test "$(git -C model-training rev-parse HEAD:participating_cognition_v1.py)" = "dec14d11ef77930e3cc5f857a3242b651f920055"
      - name: Real Training/Mono cognition task journal tests
        working-directory: v-e-r-a
        env:
          VERA_MONO_SOURCE_ROOT: ${{ github.workspace }}/vera-mono
          VERA_TRAINING_SOURCE_ROOT: ${{ github.workspace }}/model-training
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p test_cognition_task_gate.py -v
      - name: Compile Integration sources
        working-directory: v-e-r-a
        run: python -m compileall -q integration tests
