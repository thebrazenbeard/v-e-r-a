name: Discovery composed lifecycle validation

on:
  push:
    branches:
      - "work/discovery-lifecycle-current-composed-v1-20260920"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate Discovery source and lifecycle
        run: python tools/validate_discovery.py
      - name: Validate repository reconciliation currentness
        run: python tools/validate_reconciliation.py
      - name: Discovery hostile/unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q tools tests
      - name: Diff check
        run: git diff --check
