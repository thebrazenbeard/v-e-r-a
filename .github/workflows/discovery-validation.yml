name: Discovery validation

on:
  pull_request:
    paths:
      - "architecture/**"
      - "candidates/**"
      - "docs/**"
      - "portfolio/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/discovery-validation.yml"
  push:
    branches:
      - "vera/discovery-shared-substrate-v1"
    paths:
      - "architecture/**"
      - "candidates/**"
      - "docs/**"
      - "portfolio/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/discovery-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate Discovery source
        run: python tools/validate_discovery.py
      - name: Validate repository reconciliation currentness
        run: python tools/validate_reconciliation.py
      - name: Run Discovery regressions
        run: python -m unittest discover -s tests -v
      - name: Compile Discovery Python
        run: python -m compileall -q tools tests
