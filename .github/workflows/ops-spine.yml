name: Vera Works Ops Spine

on:
  push:
    paths:
      - "contracts/**"
      - "vera_works/**"
      - "tests/**"
      - "ops/events/**"
      - "prompts/**"
      - "governance/**"
      - "docs/AUTOMATION_SPINE.md"
      - "docs/INFRASTRUCTURE_TRIGGERS.md"
      - "docs/superpowers/specs/**"
      - ".github/workflows/ops-spine.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "vera_works/**"
      - "tests/**"
      - "ops/events/**"
      - "prompts/**"
      - "governance/**"
      - "docs/AUTOMATION_SPINE.md"
      - "docs/INFRASTRUCTURE_TRIGGERS.md"
      - "docs/superpowers/specs/**"
      - ".github/workflows/ops-spine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate event store
        run: python -m vera_works.validate_repo ops/events
