name: R10A1 frozen-manifest validator qualification

on:
  push:
    branches:
      - radar/r10a1-validator-freeze-schema-repair-20260919
  pull_request:
    paths:
      - tools/validate_r10a1.py
      - tests/test_r10a1_local_validation.py
      - .github/workflows/r10a1-validator.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/vcp-integrity.txt
      - name: Validate frozen R10A1 subject
        run: python tools/validate_r10a1.py
      - name: Run current repository tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile validator and tests
        run: python -m py_compile tools/validate_r10a1.py tests/test_r10a1_local_validation.py
      - name: Diff check
        run: git diff --check b4d9aaa8560de12252dd29996379b0af8e0ca0d1...HEAD
