name: redworm-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m redworm init /tmp/redworm-ci.db
          python -m redworm ingest /tmp/redworm-ci.db examples/synthetic_white.json
          python -m redworm verify /tmp/redworm-ci.db
