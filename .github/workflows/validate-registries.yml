name: Validate registries

on:
  pull_request:
    paths:
      - 'registry/**'
      - 'tools/on_theo_registry/**'
      - 'scripts/validate_registry.py'
      - 'scripts/rehearse_materialization.py'
      - 'scripts/audit_rebase_preconditions.py'
      - 'tests/test_registry_*.py'
      - 'tests/test_materialization_rehearsal.py'
      - 'docs/REGISTRY_MATERIALIZATION_REHEARSAL_V1.md'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - 'receipts/ON_THEO_REBASE_PRECONDITION_AUDIT_V2.yaml'
      - '.github/workflows/validate-registries.yml'
  push:
    paths:
      - 'registry/**'
      - 'tools/on_theo_registry/**'
      - 'scripts/validate_registry.py'
      - 'scripts/rehearse_materialization.py'
      - 'scripts/audit_rebase_preconditions.py'
      - 'tests/test_registry_*.py'
      - 'tests/test_materialization_rehearsal.py'
      - 'docs/REGISTRY_MATERIALIZATION_REHEARSAL_V1.md'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - 'receipts/ON_THEO_REBASE_PRECONDITION_AUDIT_V2.yaml'
      - '.github/workflows/validate-registries.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run validator tests
        run: pytest -q
      - name: Validate repository registries
        run: python scripts/validate_registry.py --root . --json
      - name: Audit extension rebase preconditions
        run: python scripts/audit_rebase_preconditions.py --root . --subject HEAD
      - name: Rehearse registry materialization
        run: python scripts/rehearse_materialization.py --root .
