name: Verify Achilles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "$GITHUB_REPOSITORY" . -- --no-checkout
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Show interpreter
        run: python3 --version

      - name: Compile Python
        run: python3 -m compileall -q training tests security

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify frozen package manifest
        run: python3 training/roles/seven/tools/training_checkpoint.py verify-package training/roles/seven/v1.0.0

      - name: Verify frozen package checksum ledger
        working-directory: training/roles/seven/v1.0.0
        run: sha256sum -c SHA256SUMS.txt
