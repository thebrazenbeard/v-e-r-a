[package]
name = "vera-desktop"
version = "0.1.1"
edition = "2021"
description = "Local Vera desktop prototype; response-only inference"

[lib]
name = "vera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
