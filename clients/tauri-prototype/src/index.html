<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vera Desktop</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell">
<header><h1>V E R A</h1><div class="subhead">LOCAL INFERENCE / DESKTOP</div></header>
<section class="tool"><div class="status" id="status" role="status" aria-live="polite">Checking local gateway…</div><div class="controls"><label for="model">Model</label><select id="model" aria-label="Installed local model"><option>Loading…</option></select><button type="button" id="connect">Reconnect</button></div></section>
<section id="history" class="history" role="log" aria-live="polite" aria-label="Vera conversation"><div class="intro">Private local inference on Lappy. Replies use the encrypted STM journal when it is enabled.</div></section>
<form id="composer" class="composer"><label for="prompt" class="sr">Message Vera</label><textarea id="prompt" placeholder="Message Vera…  Ctrl + Enter to send" maxlength="4096" rows="2"></textarea><button id="send" type="submit">Send</button></form>
<footer>RESPONSIVE • LOCAL MODEL • RESPONSE ONLY</footer>
</main><script src="app.js"></script></body></html>
