[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-conscience"
version = "0.5.0"
description = "Provider-neutral simulated conscience and hostile-review layer for AI runtime behavior"
requires-python = ">=3.11"
authors = [{name = "Patrick Sims"}]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cricket = "cricket.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
