claim_additions:
  - id: CLM-DUMUZID-BAAL-CHRONOLOGY-COMPATIBLE
    proposition: "Old Babylonian Dumuzid traditions and eighteenth-century Mari Dumuzi death/return attestations predate the surviving Late Bronze Age Baal Cycle tablets, so chronology permits possible influence but does not establish it."
    claim_type: TRANSMISSION_CHRONOLOGY_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian, mesopotamian, ugaritic]
    supporting_sources:
      - source_id: SRC-MARI-A1146-DUMUZI
        locator: "Zimri-Lim year 12 / first half of 18th century BCE"
        relation: EARLIER_INTERMEDIATE_ATTESTATION
        access_mode: INDIRECT_SCHOLARLY_READBACK
      - source_id: SCH-SMITH-1994-UGARITIC-BAAL-CYCLE
        locator: "introductory dating discussion"
        relation: LATE_BRONZE_UGARIT_CONTROL
        access_mode: SCHOLARLY_EDITION
    opposing_sources: []
    confidence: high-for-relative-chronology
    contested: false

  - id: CLM-MARI-DUMUZI-CONTACT-FIELD
    proposition: "The three Mari documents summarized by Ayali-Darshan provide a real eighteenth-century West Asian contact field for Dumuzi death, burial, and return traditions, but do not by themselves document transmission to Ugarit."
    claim_type: CONTACT_FIELD_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [mesopotamian, mari, west_semitic]
    supporting_sources:
      - source_id: SRC-MARI-A1146-DUMUZI
        locator: "death and return reference"
        relation: MARI_DEATH_RETURN_ATTESTATION
        access_mode: INDIRECT_SCHOLARLY_READBACK
      - source_id: SRC-MARI-A4540-DUMUZI
        locator: "burial record"
        relation: MARI_BURIAL_ATTESTATION
        access_mode: INDIRECT_SCHOLARLY_READBACK
      - source_id: SRC-MARI-1987-14-DUMUZI
        locator: "return record"
        relation: MARI_RETURN_ATTESTATION
        access_mode: INDIRECT_SCHOLARLY_READBACK
      - source_id: SCH-AYALI-DARSHAN-2024-DYING-RISING
        locator: "chapter 2, Dying and Rising God in Mari Texts"
        relation: CURRENT_SCHOLARLY_SYNTHESIS
        access_mode: JSTOR_OR_PUBLISHER_SUMMARY
    opposing_sources: []
    confidence: high-for-contact-field-low-for-direct-lineage
    contested: false

  - id: CLM-BAAL-REVIVAL-EVIDENCE-STRONGER
    proposition: "Ayali-Darshan 2024 identifies explicit Baal death and revival sequences in the Ugaritic cycle and argues that the second-millennium Levantine evidence for a dying-and-rising god is stronger than the corresponding Mesopotamian Dumuzid evidence."
    claim_type: COMPARATIVE_EVIDENCE_STRENGTH
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
      - source_id: SCH-AYALI-DARSHAN-2024-DYING-RISING
        locator: "chapters 1 and 3; publisher/JSTOR summaries"
        relation: CURRENT_COMPARATIVE_SYNTHESIS
        access_mode: JSTOR_OR_PUBLISHER_SUMMARY
    opposing_sources: []
    confidence: high-for-author-stated-thesis
    contested: true

  - id: CLM-DUMUZID-BAAL-MECHANICS-DIFFER
    proposition: "Dumuzid's substitution/galla/sister-alternation architecture differs materially from Baal's conflict with Mot and Ugaritic death/return architecture, so high-level death-return similarity cannot be treated as narrative identity."
    claim_type: COMPARATIVE_CAUSAL_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian, ugaritic]
    supporting_sources:
      - source_id: SRC-DUMUZID-GESHTINANA
        locator: "substitution, galla, escape and lament sequence"
        relation: DUMUZID_CAUSAL_ARCHITECTURE
        access_mode: CDLI_SCORE_AND_ETCSL
      - source_id: SRC-UGARIT-BAAL-CYCLE
        locator: "KTU 1.5-1.6 death/return complex"
        relation: BAAL_CAUSAL_ARCHITECTURE
        access_mode: SCHOLARLY_EDITION
      - source_id: SCH-AYALI-DARSHAN-2024-DYING-RISING
        locator: "Ugaritic dying/rising discussion"
        relation: COMPARATIVE_CONTROL
        access_mode: CURRENT_SCHOLARSHIP
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DUMUZID-BAAL-DIRECT-CARRIER-NOT-FOUND
    proposition: "V1 has not identified a named scribe, copied tablet, lexical dependency, ritual institution, or documentary chain carrying a Dumuzid death-return composition from Mesopotamia or Mari into the Ugaritic Baal Cycle."
    claim_type: TRANSMISSION_CARRIER_CONTROL
    evidence_class: [PROJECT_INFERENCE, SCHOLARLY_INTERPRETATION]
    traditions: [mesopotamian, mari, ugaritic]
    supporting_sources:
      - source_id: SCH-AYALI-DARSHAN-2024-DYING-RISING
        locator: "current challenge to Dumuzi-prototype model"
        relation: HOSTILE_TRANSMISSION_CONTROL
        access_mode: CURRENT_SCHOLARSHIP
      - source_id: SCH-SMITH-1994-UGARITIC-BAAL-CYCLE
        locator: "Ugaritic text/scribe/date context"
        relation: TARGET_TEXT_PROVENANCE
        access_mode: SCHOLARLY_EDITION
    opposing_sources: []
    confidence: high-for-v1-search-state
    contested: false

  - id: CLM-DUMUZID-BAAL-DIRECTION-UNRESOLVED
    proposition: "The direction of any historical relationship between Dumuzid/Tammuz and Baal death-return traditions remains unresolved; current scholarship directly challenges a default Mesopotamia-to-Ugarit prototype model."
    claim_type: TRANSMISSION_DIRECTION_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [mesopotamian, ugaritic]
    supporting_sources:
      - source_id: SCH-AYALI-DARSHAN-2024-DYING-RISING
        locator: "findings on limited Mesopotamian revival evidence and Levantine Baal"
        relation: CURRENT_DIRECTIONAL_CHALLENGE
        access_mode: CURRENT_SCHOLARSHIP
    opposing_sources: []
    confidence: high-for-unresolved-status
    contested: true

