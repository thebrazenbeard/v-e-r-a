claim_additions:
  - id: CLM-JOSEPHUS-JEWISH-GROUPS-DIFFER
    proposition: "Josephus distinguishes Pharisees, Sadducees, and Essenes as Jewish schools/groups with materially different teachings and practices."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [second-temple-judaism]
    supporting_sources:
      - source_id: SRC-JOSEPHUS-WAR-2
        locator: "War II.8"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: DIGITAL_EDITION
      - source_id: SRC-JOSEPHUS-ANTIQUITIES-18
        locator: "Antiquities XVIII"
        relation: SAME_AUTHOR_ADDITIONAL_ACCOUNT
        access_mode: DIGITAL_EDITION
    opposing_sources: []
    confidence: high-for-josephus-representation
    contested: false
    notes:
      - "This does not establish that Josephus's taxonomy exhausts Second Temple Jewish diversity."

  - id: CLM-QUMRAN-RULE-TORAH-JUDGMENT-COMMUNITY
    proposition: "The Community Rule represents a disciplined Jewish community organized around Torah study, graded admission, communal norms, separation, and preparation for divine judgment."
    claim_type: TEXTUAL_SYSTEM_SUMMARY
    evidence_class: [PRIMARY_TEXT]
    traditions: [second-temple-judaism, dead-sea-scrolls]
    supporting_sources:
      - source_id: SRC-DSS-COMMUNITY-RULE
        locator: "Community Rule"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: INSTITUTIONAL_TRANSLATION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DSS-APOCALYPTICISM-NOT-WHOLE-JUDAISM
    proposition: "Apocalypticism and messianism are significant within Dead Sea Scroll and wider Second Temple Jewish traditions but should not be treated as exhaustive of Second Temple Judaism."
    claim_type: HISTORICAL_SYNTHESIS
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [second-temple-judaism]
    supporting_sources:
      - source_id: SCH-KNIBB-2011-DSS-APOCALYPTICISM
        locator: "chapter abstract and argument"
        relation: SCHOLARLY_SYNTHESIS
        access_mode: PUBLISHER_ABSTRACT
    opposing_sources: []
    confidence: high-for-non-exhaustiveness
    contested: false

  - id: CLM-ELEUSIS-INITIATION-AFTERLIFE
    proposition: "The Homeric Hymn to Demeter links Eleusinian initiation with a privileged postmortem fate while not disclosing a complete ritual script."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [greek-religion, eleusinian]
    supporting_sources:
      - source_id: SRC-HOMERIC-HYMN-DEMETER
        locator: "closing initiation/afterlife section"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: DIGITAL_EDITION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-PLATO-ER-MORAL-AFTERLIFE
    proposition: "Plato's Myth of Er presents postmortem judgment, differentiated reward/punishment, future-life choice, and reincarnation within a philosophical myth."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [greek-philosophy, platonism]
    supporting_sources:
      - source_id: SRC-PLATO-REPUBLIC-10
        locator: "Republic 614b-621d"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: DIGITAL_EDITION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-ROMAN-IMPERIAL-CULT-RELIGIOUSLY-EMBEDDED
    proposition: "Roman emperor worship and imperial honours functioned within existing Roman and provincial religious institutions rather than constituting one wholly foreign, centrally imposed pseudo-religion."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [roman-religion, imperial-cult]
    supporting_sources:
      - source_id: SRC-AUGUSTUS-RES-GESTAE
        locator: "sections 19-21"
        relation: PRIMARY_IMPERIAL_RELIGIOUS_CONTEXT
        access_mode: DIGITAL_EDITION
      - source_id: SCH-GRADEL-2002-EMPEROR-WORSHIP
        locator: "book argument"
        relation: SCHOLARLY_SYNTHESIS
        access_mode: PUBLISHER_ABSTRACT_AND_CONTENTS
    opposing_sources: []
    confidence: high-for-embeddedness
    contested: false

  - id: CLM-GREEK-DAIMON-NOT-EQUAL-CHRISTIAN-DEMON
    proposition: "Greek daimon terminology covers historically diverse intermediary/superhuman meanings and is not semantically identical by default to later Christian 'demon'."
    claim_type: SEMANTIC_HISTORICAL_INFERENCE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [greek-religion, christianity]
    supporting_sources:
      - source_id: SCH-GASPARRO-2016-DAIMONIC-POWER
        locator: "chapter abstract and synthesis"
        relation: SCHOLARLY_SEMANTIC_HISTORY
        access_mode: PUBLISHER_ABSTRACT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-MYSTERY-CULTS-ONE-UNIFORM-RELIGION
    proposition: "Greek and Roman mystery cults formed one cohesive religion with a single theology, ritual grammar, and salvation doctrine."
    claim_type: HISTORICAL_GENERALIZATION
    evidence_class: [UNKNOWN]
    traditions: [greco-roman]
    supporting_sources: []
    opposing_sources:
      - source_id: SCH-KAROGLOU-2013-MYSTERY-CULTS
        locator: "essay"
        relation: WARNS_AGAINST_COHESIVE_CATEGORY
        access_mode: INSTITUTIONAL_FULL_TEXT
    confidence: low
    contested: true

