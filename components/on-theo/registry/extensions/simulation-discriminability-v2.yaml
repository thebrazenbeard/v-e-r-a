    relations: []

claim_additions:
  - id: CLM-GENERIC-SIMULATION-WEAK-FALSIFIABILITY
    proposition: "An unconstrained simulation hypothesis has weak scientific discriminability because arbitrary simulator choices can accommodate a very wide range of possible observations."
    claim_type: EPISTEMIC_MODEL_ASSESSMENT
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [simulation-theory]
    supporting_sources:
      - {source_id: SCH-SWAZO-2015-CRITICAL-SIMULATION, locator: "abstract/conclusion", relation: FALSIFIABILITY_CRITIQUE, access_mode: OPEN_ARCHIVE}
    opposing_sources: []
    confidence: high-for-unconstrained-model
    contested: true

  - id: CLM-SIM-MODEL-SPECIFIC-TESTING-POSSIBLE
    proposition: "Specific simulation architectures can make testable predictions even when the generic simulation hypothesis does not; falsification of one implementation family does not falsify simulation generally."
    claim_type: EMPIRICAL_TEST_SCOPE
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [simulation-theory, physics]
    supporting_sources:
      - {source_id: SCH-BEANE-DAVOUDI-SAVAGE-2012-LATTICE, locator: "model assumptions and observable consequences", relation: SPECIFIC_IMPLEMENTATION_TEST, access_mode: OPEN_PREPRINT}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-OBSERVER-COUNTING-NONNEUTRAL
    proposition: "Simulation-argument probabilities depend on contestable choices about observer reference classes, machine consciousness, simulator behavior and self-location; population dominance alone does not settle the probability that a given observer is simulated."
    claim_type: BAYESIAN_ANTHROPIC_CRITIQUE
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [simulation-theory]
    supporting_sources:
      - {source_id: SCH-PARODI-2022-SIM-LIKELIHOOD, locator: "abstract", relation: BACKGROUND_ASSUMPTION_CRITIQUE, access_mode: INDEXED_ABSTRACT}
      - {source_id: SCH-HARRIS-2023-SIM-RECONSIDERED, locator: "abstract", relation: SIMULATOR_BEHAVIOR_CRITIQUE, access_mode: PUBLISHER_ABSTRACT}
      - {source_id: SCH-CRAWFORD-2013-FREAK-OBSERVERS, locator: "abstract", relation: SELF_LOCATION_CRITIQUE, access_mode: INDEXED_ABSTRACT}
      - {source_id: SCH-KIPPING-2020-BAYESIAN-SIMULATION, locator: "Bayesian model", relation: MODEL_UNCERTAINTY_CONTROL, access_mode: OPEN_PREPRINT}
    opposing_sources: []
    confidence: high-for-dependency-claim
    contested: true

  - id: CLM-OBSERVATIONAL-EQUIVALENCE-PROVENANCE-UNDERDETERMINED
    proposition: "If a simulated world and a non-simulated world generate exactly the same observer-accessible evidence, internal observation alone underdetermines which provenance obtains."
    claim_type: EPISTEMIC_PROJECT_INFERENCE
    evidence_class: [PROJECT_INFERENCE]
    traditions: [simulation-theory, epistemology]
    supporting_sources: []
    opposing_sources: []
    confidence: high-as-conditional
    contested: true

  - id: CLM-SIM-COMPATIBILITY-NOT-EVIDENCE
    proposition: "The fact that an external simulator could reproduce a miracle, revelation, incarnation-like avatar, resurrection or eschatological transformation does not by itself increase the historical probability that the reported event occurred or that simulation caused it."
    claim_type: COMPARATIVE_EPISTEMIC_GUARD
    evidence_class: [PROJECT_INFERENCE]
    traditions: [simulation-theory, christianity, historical-jesus]
    supporting_sources: []
    opposing_sources: []
    confidence: high-as-inference-rule
    contested: false

  - id: CLM-YESHUA-SIMULATION-SPECIFIC-EVIDENCE-NONE
    proposition: "The current On-Theo Yeshua corpus contains no established feature that is more specifically predicted by a simulation/intervention model than by historically available Jewish apocalyptic, prophetic, healing, resurrection, literary-memory or ordinary causal alternatives."
    claim_type: NEGATIVE_COMPARATIVE_FINDING
    evidence_class: [PROJECT_INFERENCE, UNKNOWN]
    traditions: [historical-jesus, simulation-theory]
    supporting_sources: []
    opposing_sources: []
    confidence: provisional
    contested: true
    notes:
      - "This claim is intentionally revisable if a genuinely discriminating feature is identified."

