concept_additions:
  - id: CON-SIM-PROVENANCE-DISCRIMINABILITY
    canonical_label: simulation provenance discriminability
    kind: epistemic-test-concept
    forms: [provenance-discriminability, simulation-detectability]
    semantic_guard: "Distinguish detecting regularity or implementation artifacts from establishing external provenance."
    relations: []

  - id: CON-EXTERNAL-INTERVENTION
    canonical_label: external intervention in an embedded world
    kind: causal-model
