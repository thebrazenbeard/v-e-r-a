claim_additions:
  - id: CLM-GIDIM-DECEASED-GHOST-SEMANTIC-CORE
    proposition: "ePSD2 classifies gidim as the spirit of a deceased person or ghost across its attested corpus, including Early Dynastic and Ur III occurrences."
    claim_type: LEXICAL_SEMANTIC_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SCH-EPSD2-GIDIM-GHOST
        locator: "sense and period distribution"
        relation: LEXICAL_DATABASE
        access_mode: INSTITUTIONAL_DIGITAL_LEXICON
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-GIDIM-NOT-GENERIC-SUPERNATURAL
    proposition: "gidim should not be normalized as a generic supernatural-being term; its ePSD2 semantic core is specifically the ghost or spirit of a deceased person."
    claim_type: LEXICAL_SCOPE_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SCH-EPSD2-GIDIM-GHOST
        locator: "gidim [GHOST] sense"
        relation: LEXICAL_DATABASE
        access_mode: INSTITUTIONAL_DIGITAL_LEXICON
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-KUR-POLYSEMOUS-NOT-UNDERWORLD-DEFAULT
    proposition: "kur is polysemous across land/country, mountain, and underworld senses and cannot be globally translated as underworld."
