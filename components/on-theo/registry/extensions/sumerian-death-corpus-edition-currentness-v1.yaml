claim_additions:
  - id: CLM-GEN-GADOTTI-2014-POST-ETCSL-REEDITION
    proposition: "Gadotti 2014 is a post-ETCSL new edition of Gilgamesh, Enkidu and the Netherworld that incorporates additional manuscripts and therefore creates a line-level currentness dependency for ETCSL-derived occurrence mapping."
    claim_type: EDITION_CURRENTNESS_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SCH-GADOTTI-2014-GEN-EDITION
        locator: "publisher description; edition/manuscript/textual-matrix contents"
        relation: LATER_CRITICAL_EDITION
        access_mode: PUBLISHER_DESCRIPTION
    opposing_sources: []
    confidence: high-for-edition-existence-and-currentness-dependency
    contested: false

  - id: CLM-INANA-ATTINGER-LATER-PHILOLOGICAL-CONTROL
    proposition: "Attinger's Inana's Descent study, published in 2019 and updated in 2021, is a later philological translation/control than ETCSL and should be cross-checked without being silently relabeled as a full new critical edition."
    claim_type: EDITION_CURRENTNESS_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SCH-ATTINGER-2021-INANA-DESCENT
        locator: "Zenodo V2 metadata and working paper"
        relation: LATER_PHILOLOGICAL_CONTROL
        access_mode: OPEN_ACCESS_WORKING_PAPER
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DEATH-GILGAMESH-ETCSL-2000-EDITION-LINEAGE
    proposition: "ETCSL's Death of Gilgamesh bibliography directly uses the Cavigneaux/al-Rawi 2000 major re-edition based on Meturan and republished Nippur material."
