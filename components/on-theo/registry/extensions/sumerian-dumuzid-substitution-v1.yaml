claim_additions:
  - id: CLM-DUMUZID-GESHTINANA-GALLA-KUR-OPENING
    proposition: "Dumuzid and Geshtin-ana places galla captors and repeated kur descent language in the same opening sequence, preserving captor-entity and death-realm-place semantics as distinct categories."
    claim_type: COMPOSITION_LEVEL_TYPE_CONTROL
    evidence_class: [PRIMARY_TEXT, MATERIAL_EVIDENCE, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-DUMUZID-GESHTINANA
        locator: "lines 1-10"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: CDLI_SCORE
      - source_id: SCH-CDLI-Q000344-DUMUZID-GESHTINANA
        locator: "P346096 aligned opening sequence"
        relation: ALIGNED_WITNESS_CONFIRMATION
        access_mode: CDLI_SCORE
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DUMUZID-GESHTINANA-HANDOVER
