        locator: "Temple Sounding reassessment; royal inscription caution"
        relation: MODERN_REASSESSMENT
        access_mode: OPEN_ACCESS_FULL_TEXT
    opposing_sources: []
    confidence: high-as-methodological-control
    contested: false
