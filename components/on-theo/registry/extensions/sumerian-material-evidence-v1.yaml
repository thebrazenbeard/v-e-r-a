claim_additions:
  - id: CLM-NIPPUR-URIII-ENLIL-TEMPLE-MATERIAL
    proposition: "At Nippur, excavation publication identifies a Temple of Enlil northeast of the ziggurat, apparently built by Ur-Nammu, with continued later use/rebuilding."
    claim_type: ARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-NIPPUR-I-ENLIL-SCRIBAL-QUARTER
        locator: "Temple of Enlil"
        relation: EXCAVATION_PUBLICATION
        access_mode: INSTITUTIONAL_PUBLICATION
    opposing_sources: []
    confidence: high-for-published-identification
    contested: false

  - id: CLM-NIPPUR-PRIVATE-CHAPELS-URIII-ISINLARSA
    proposition: "Nippur Scribal Quarter excavations reported clear private chapels in Ur III and early Isin-Larsa levels, demonstrating a material religious setting distinct from the monumental temple precinct."
    claim_type: ARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-NIPPUR-I-ENLIL-SCRIBAL-QUARTER
        locator: "Private Houses in the Scribal Quarter"
        relation: EXCAVATION_PUBLICATION
        access_mode: INSTITUTIONAL_PUBLICATION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-UR-CEMETERY-NOT-TEMPLE-LITURGY
    proposition: "Ur's Royal Cemetery is direct material evidence for mortuary practice and social differentiation, but it is not by itself direct evidence for the daily liturgy of the Nanna temple."
    claim_type: EVIDENCE_SCOPE_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, PROJECT_INFERENCE]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-UR-PENN-EXCAVATION-CORPUS
        locator: "Royal Cemetery"
        relation: MATERIAL_CONTEXT
        access_mode: INSTITUTIONAL_ARCHIVE
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-GIRSU-NINGIRSU-TEMPLE-CONTEXT-RECOVERED
    proposition: "Modern Girsu excavations materially document the Ningirsu sacred district with mudbrick architecture and inscribed cones while explicitly addressing the weak context of many earlier finds."
    claim_type: ARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-GIRSU-BRITISH-MUSEUM-PROJECT
        locator: "sacred district / temple and sanctuary of Ningirsu"
        relation: ACTIVE_EXCAVATION
        access_mode: INSTITUTIONAL_PROJECT_REPORT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-LAGASH-INSTITUTIONAL-MATERIAL-PLURALITY
    proposition: "Lagash excavation records materially distinguish temple complexes, an administrative complex, craft-production areas, housing, streets, and other public spaces rather than one undifferentiated sacred monumental zone."
    claim_type: ARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-LAGASH-PENN-ARCHAEOLOGICAL-PROJECT
        locator: "legacy temple complexes and modern neighborhood/craft investigations"
        relation: ARCHAEOLOGICAL_PROJECT_SYNTHESIS
        access_mode: INSTITUTIONAL_PROJECT_REPORT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-FARA-CENTRAL-BUILDING-CULTIC-PROBABLE
    proposition: "Modern prospection at Shuruppak maps a central building complex interpreted as likely a temple, but the cultic identification remains a scholarly interpretation rather than a closed material fact."
    claim_type: ARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-FARA-PROSPECTION-2022
        locator: "central building complex"
        relation: GEOPHYSICAL_PROSPECTION
        access_mode: OPEN_ACCESS_FULL_TEXT
    opposing_sources: []
    confidence: probable-not-closed
    contested: true
    alternatives:
      - "Cultic/temple complex."
      - "Other official or mixed institutional building pending excavation."

  - id: CLM-URUK-EANNA-DURATION-NOT-SEMANTIC-CONTINUITY
    proposition: "Uruk preserves a long stratified monumental sequence in the Eanna sanctuary area, but architectural continuity across phases does not by itself establish unchanged ritual or theology."
    claim_type: EVIDENCE_SCOPE_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, PROJECT_INFERENCE]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-URUK-DAI-ARCHITECTURE
        locator: "Eanna sanctuary architectural sequence"
        relation: LONG_TERM_EXCAVATION_RECORD
        access_mode: INSTITUTIONAL_PROJECT_REPORT
    opposing_sources: []
    confidence: high-for-scope-control
    contested: false

  - id: CLM-ERIDU-URIII-EABZU-MATERIAL
    proposition: "At Eridu, renewed excavation supports a major Ur III monumental E-abzu/E-unir phase in which earlier terraces were reused within a large ziggurat platform and precinct complex."
    claim_type: ARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-ERIDU-2022-EABZU-REASSESSMENT
        locator: "Operations 1 and 3 / general conclusion"
        relation: EXCAVATION_STRATIGRAPHY
        access_mode: OPEN_ACCESS_FULL_TEXT
    opposing_sources: []
    confidence: high-for-uriii-phase
    contested: false

  - id: CLM-ERIDU-LEGACY-TEMPLE-LABEL-NOT-PHASE-PROOF
    proposition: "Eridu's legacy 'Temple Sounding' label and later royal cultic language cannot by themselves establish that every architectural level represents an Enki temple; phase-specific archaeological evidence remains required."
    claim_type: EVIDENCE_SCOPE_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
