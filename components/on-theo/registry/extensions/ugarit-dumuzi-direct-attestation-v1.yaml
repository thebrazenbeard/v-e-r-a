        locator: "reverse ii 7, Ugaritic column"
        relation: DAMAGED_COLUMN_CONTROL
        access_mode: ORACC_DCCLT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-UGARIT-DUMUZI-CONTACT-UPGRADE
    proposition: "Ugarit's Mesopotamian-contact model must be upgraded from general literary capacity to direct Dumuzi-specific scholastic exposure, while keeping narrative, cultic, and Ilimilku-specific Dumuzi transmission unestablished."
    claim_type: TRANSMISSION_CARRIER_CORRECTION
    evidence_class: [PRIMARY_TEXT, MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
