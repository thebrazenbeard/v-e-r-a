        relation: MULTILINGUAL_LEXICAL_ROW
        access_mode: ORACC_DCCLT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-UGARIT-DUMUZI-UGARITIC-EQUIVALENT-LOST
    proposition: "The Ugaritic-equivalent column at the Dumuzi row of P332950 is broken/lost, so the surviving witness does not identify a local Ugaritic deity as Dumuzi's equivalent."
    claim_type: TEXTUAL_ABSENCE_BOUNDARY
    evidence_class: [PRIMARY_TEXT, MATERIAL_EVIDENCE, PROJECT_INFERENCE]
    traditions: [ugaritic, mesopotamian]
