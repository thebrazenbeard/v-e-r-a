    claim_type: LOST_TEXT_CONTROL
    evidence_class: [PRIMARY_TEXT, MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [mesopotamian, hurrian, ugaritic]
    supporting_sources:
      - source_id: SCH-DCCLT-WEIDNER-UGARIT-P332950
        witness_id: WIT-UGARIT-WEIDNER-P332950
