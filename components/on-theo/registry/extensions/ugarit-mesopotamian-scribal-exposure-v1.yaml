  - id: CLM-UGARIT-AKKADIAN-GILGAMESH-MATERIAL
    proposition: "Multiple Middle Babylonian Akkadian Gilgamesh literary tablets are physically attested from Ugarit, establishing direct material evidence that Mesopotamian narrative literature circulated at the site."
    claim_type: MATERIAL_LITERARY_CONTACT_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [mesopotamian, ugaritic]
    supporting_sources:
      - source_id: SCH-CDLI-UGARIT-GILGAMESH-CORPUS
        witness_id: WIT-UGARIT-GILGAMESH-P500683
        locator: "P500683 / RS 94.2066"
        relation: UGARIT_AKKADIAN_LITERARY_WITNESS
        access_mode: CDLI
      - source_id: SCH-CDLI-UGARIT-GILGAMESH-CORPUS
        witness_id: WIT-UGARIT-GILGAMESH-P500685
        locator: "P500685 / RS 94.2082"
        relation: UGARIT_AKKADIAN_LITERARY_WITNESS
        access_mode: CDLI
      - source_id: SCH-CDLI-UGARIT-GILGAMESH-CORPUS
        witness_id: WIT-UGARIT-GILGAMESH-P500686
        locator: "P500686 / RS 94.2083"
        relation: UGARIT_AKKADIAN_LITERARY_WITNESS
        access_mode: CDLI
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-UGARIT-CUNEIFORM-SCRIBAL-TRAINING
    proposition: "Middle Babylonian lexical and school texts from Ugarit provide material evidence for local participation in the cuneiform scholastic tradition."
    claim_type: SCRIBAL_ENVIRONMENT_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
      - source_id: SCH-ORACC-UGARIT-LEXICAL-SCHOOL
        locator: "P347890, P347900 and related Ugarit lexical texts"
        relation: CUNEIFORM_SCHOOL_EVIDENCE
        access_mode: ORACC_DCCLT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-UGARIT-MESOPOTAMIAN-CONTACT-CAPACITY
    proposition: "The combination of Akkadian literary tablets and cuneiform scholastic materials at Ugarit establishes a historically plausible institutional carrier environment for Mesopotamian literary influence."
    claim_type: TRANSMISSION_CARRIER_ENVIRONMENT
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
      - source_id: SCH-CDLI-UGARIT-GILGAMESH-CORPUS
        locator: "Akkadian Gilgamesh tablets at Ugarit"
        relation: LITERARY_CONTACT
        access_mode: CDLI
      - source_id: SCH-ORACC-UGARIT-LEXICAL-SCHOOL
        locator: "cuneiform scholastic texts at Ugarit"
        relation: SCRIBAL_CAPACITY
        access_mode: ORACC_DCCLT
      - source_id: SCH-SCHNIEDEWIND-HUNT-UGARIT-SCRIBAL-CENTER
        locator: "discussion of Ugarit as scribal-training center"
        relation: SCHOLARLY_SYNTHESIS
        access_mode: PUBLISHER_EXCERPT
    opposing_sources: []
    confidence: high-for-general-capacity
    contested: false

  - id: CLM-UGARIT-DUMUZID-SOURCE-NOT-IDENTIFIED
    proposition: "V1 has not identified a Sumerian Dumuzid or Akkadian Tammuz literary source excavated at Ugarit, so general Mesopotamian scribal contact cannot be promoted to specific Dumuzid-source exposure."
    claim_type: TRANSMISSION_SOURCE_CONTROL
    evidence_class: [PROJECT_INFERENCE, SCHOLARLY_INTERPRETATION]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
      - source_id: SCH-CDLI-UGARIT-GILGAMESH-CORPUS
        locator: "positive control: Gilgamesh material"
        relation: GENERAL_CONTACT_CONTROL
        access_mode: CDLI
    opposing_sources: []
    confidence: high-for-v1-search-state
    contested: false

  - id: CLM-ILIMILKU-MESOPOTAMIAN-ACCESS-POSSIBLE-NOT-PROVEN
    proposition: "Ugarit's scribal environment makes Mesopotamian literary exposure plausible for Ugaritic scribes in general, but V1 does not establish that Ilimilku personally read a specific Mesopotamian or Dumuzid text."
    claim_type: NAMED_CARRIER_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
      - source_id: SCH-SCHNIEDEWIND-HUNT-UGARIT-SCRIBAL-CENTER
        locator: "multilingual scribal environment"
        relation: INSTITUTIONAL_CAPACITY
        access_mode: PUBLISHER_EXCERPT
      - source_id: SCH-EUPT-ILIMILKU-COLOPHON
        locator: "Ilimilku scribal identity"
        relation: NAMED_TARGET_SCRIBE
        access_mode: CRITICAL_EDITION_PROJECT
    opposing_sources: []
    confidence: high-for-distinction
    contested: false

  - id: CLM-DUMUZID-BAAL-CARRIER-CAPACITY-UPGRADED
    proposition: "The Dumuzid-to-Baal transmission model can now mark Ugaritic scribal institutions as materially grounded plausible carrier capacity while retaining direct Dumuzid source contact and Ilimilku-specific transmission as unestablished."
    claim_type: TRANSMISSION_CARRIER_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
      - source_id: SCH-CDLI-UGARIT-GILGAMESH-CORPUS
