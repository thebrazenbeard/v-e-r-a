schema_version: on-theo.review-registry.v1
status: PROPOSED_CANONICAL_CONTRACT
allowed_results:
  - PASS_EXACT
  - PASS_WITH_LIMITATIONS
  - CHANGES_REQUIRED
  - FAIL
  - UNRESOLVED
  - NOT_REVIEWED
execution_provenance_types:
  - SAME_RUNTIME_ROLE_PASS
  - INDEPENDENT_RUNTIME
  - EXTERNAL_HUMAN_REVIEW
  - UNKNOWN
invariants:
  - "A review result binds only the exact subject SHA and reviewed paths/claim IDs recorded in the receipt."
  - "Material subject-head movement invalidates affected receipts until re-review."
  - "Role separation does not imply independent sampling; execution_provenance must say whether the passes shared one runtime."
  - "Review approval does not authorize merge or any other protected effect."
required_fields:
  - id
  - repository
  - subject_sha
  - review_type
  - reviewer_role
  - execution_provenance
  - result
  - reviewed_artifacts
  - findings
