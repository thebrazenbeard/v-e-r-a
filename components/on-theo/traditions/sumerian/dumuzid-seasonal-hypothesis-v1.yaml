    statement: "Dumuzid and his sister alternate half-year terms."
    evidence_class: PRIMARY_TEXT
    status: SUPPORTED_HIGH
    source: "Inana's Descent c.1.4.1 lines 404-410"

  - proposition_id: PROP-DUMUZID-SEASONAL-CORRELATION
    statement: "The half-year alternation correlates with a seasonal cycle."
    evidence_class: SCHOLARLY_INTERPRETATION
    status: PLAUSIBLE_NOT_TEXTUALLY_EXPLICIT

  - proposition_id: PROP-DUMUZID-VEGETATION-DEITY
    statement: "Dumuzid is fundamentally a vegetation deity."
    evidence_class: SCHOLARLY_INTERPRETATION
    status: CONTESTED_AND_OVERBROAD
    alternatives:
      - SHEPHERD_DEITY
      - ROYAL_KINGSHIP_FIGURE
      - NETHERWORLD_OFFICER
      - SYNCRETIC_ASSOCIATION_WITH_DAMU_OR_NINGISHZIDA

  - proposition_id: PROP-DUMUZID-ANNUAL-RESURRECTION
    statement: "Dumuzid annually resurrects from death in the strong dying-and-rising-god sense."
    evidence_class: SCHOLARLY_INTERPRETATION
    status: CONTESTED_NOT_PRIMARY_TEXT_FACT

  - proposition_id: PROP-DUMUZID-WEST-ASIA-PROTOTYPE
    statement: "Dumuzid is the demonstrated origin/prototype of later West Asian dying-and-rising gods."
    evidence_class: HISTORICAL_RECONSTRUCTION
    status: NOT_ESTABLISHED
    hostile_control: "Ayali-Darshan 2024 argues the extant evidence does not support this dominant-prototype assumption."

