    proposition: "KTU 1.6 III recognizes Baal with hy 'alive/lives' and a parallel existence statement; this is life/existence language rather than a lexical Ugaritic equivalent of A.1146's iterative taru 'return.'"
    claim_type: CROSS_LANGUAGE_LEXICAL_CONTROL
