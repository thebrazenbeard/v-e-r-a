claim_additions:
  - id: CLM-A1146-DAKU-AGENTIVE-KILLING
    proposition: "The reconstructed A.1146 form idakkushu belongs to Akkadian daku 'kill' and expresses an agentive killing construction ('they kill him'), rather than merely stating that Dumuzi is dead."
    claim_type: CROSS_LANGUAGE_LEXICAL_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [mari, mesopotamian]
    supporting_sources:
      - source_id: SRC-MARI-A1146-DUMUZI
        locator: "reconstructed lines 39-44"
        relation: DAMAGED_PRIMARY_TEXT
        access_mode: SCHOLARLY_RECONSTRUCTION
      - source_id: SCH-ORACC-AKK-DAKU
        locator: "daku KILL lexical range"
        relation: AKKADIAN_LEXICAL_CONTROL
        access_mode: ORACC
    opposing_sources: []
    confidence: high-for-lemma-medium-high-for-damaged-form
    contested: false

  - id: CLM-A1146-TARU-ITERATIVE-RETURN
    proposition: "The reconstructed A.1146 ittanar form belongs to Akkadian taru 'turn/return'; current lexical evidence supports iterative values such as repeatedly coming back, not a lexical verb whose inherent meaning is 'resurrect.'"
    claim_type: CROSS_LANGUAGE_LEXICAL_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [mari, mesopotamian]
    supporting_sources:
