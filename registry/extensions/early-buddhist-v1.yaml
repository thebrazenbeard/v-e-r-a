    contested: false

  - id: CLM-SN12-20-DEPENDENT-ORIGINATION-CONDITIONALITY
    proposition: "SN 12.20 presents dependent origination as a stable conditional pattern involving birth, becoming, clinging, craving and preceding conditions rather than as creation by a first cause."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [early-buddhist]
    supporting_sources:
      - {source_id: SRC-BUDDHIST-SN-12-20, locator: "SN 12.20", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_EDITION_TRANSLATION}
    opposing_sources: []
    confidence: high-at-received-text-level
    contested: false

  - id: CLM-EARLY-BUDDHIST-TEXTS-SCHOOL-TRANSMISSION
    proposition: "The earliest recoverable Buddhist teachings are preserved through multiple school-specific textual traditions whose discrepancies and parallels are themselves evidence for reconstruction rather than direct access to one pristine transcript."
    claim_type: SOURCE_HISTORY
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [early-buddhist]
    supporting_sources:
      - {source_id: SCH-BUCKNELL-2022-RECONSTRUCTING-EARLY-BUDDHISM, locator: "Chapter 1 and book description", relation: COMPARATIVE_TEXTUAL_RECONSTRUCTION, access_mode: PUBLISHER_SUMMARY}
    opposing_sources: []
    confidence: high-for-multiple-traditions
    contested: false

  - id: CLM-BUDDHISM-BRAHMANICAL-AVANT-GARDE-MODEL
    proposition: "Early Buddhism may be best located within fluid fifth-century BCE Brahmanical and renunciant intellectual currents rather than as an external reaction to one monolithic finished Brahmanism."
    claim_type: HISTORICAL_ORIGIN_MODEL
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [early-buddhist, brahmanical]
    supporting_sources:
