claim_additions:
  - id: CLM-EARLY-CHRISTIANITY-PLURAL-SYSTEMS
    proposition: "First- and second-century Jesus/Christ-centered communities differed materially in authority structures, ritual, Torah practice, textual corpora, Christology, and eschatology; later catholic orthodoxy must not be projected as the single original configuration."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [early-christianity]
    supporting_sources:
      - {source_id: SRC-DIDACHE, locator: "whole work", relation: PRIMARY_TEXT_CONFIGURATION, access_mode: DIGITAL_TRANSLATION}
      - {source_id: SRC-IGNATIUS-MAGNESIANS, locator: "identity/ecclesiology passages", relation: PRIMARY_TEXT_CONFIGURATION, access_mode: DIGITAL_TRANSLATION}
    opposing_sources: []
    confidence: high-for-plurality
    contested: false

  - id: CLM-RABBINIC-LITERATURE-COLLECTIVE-DIVERGENT
    proposition: "Classical rabbinic literature is collective literature preserving partly divergent and contradictory views rather than one linear systematic theology."
    claim_type: LITERARY_HISTORICAL_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [rabbinic-judaism]
    supporting_sources:
      - {source_id: SCH-HEZSER-2009-RABBINIC-LITERATURE, locator: "abstract", relation: SCHOLARLY_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-MISHNAH-C200-RABBINIC-ANCHOR
    proposition: "The Mishnah reached a major compilational/redactional form around 200 CE and provides a strong anchor for a recognizable rabbinic textual movement."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [rabbinic-judaism]
    supporting_sources:
      - {source_id: SCH-GOODMAN-2015-MISHNAH, locator: "extract", relation: DATE_AND_FORMATION_SYNTHESIS, access_mode: PUBLISHER_EXTRACT}
      - {source_id: SCH-LAPIN-2012-RABBIS-ROMANS, locator: "chapter abstract", relation: MOVEMENT_FORMATION_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high-at-broad-level
    contested: false

  - id: CLM-RABBINIC-ORAL-TORAH-IDEOLOGY-DEVELOPS
    proposition: "The rabbinic ideology of authoritative Oral Torah has a historical development and should not be projected as a fully articulated timeless system into all Second Temple Judaism."
    claim_type: DIACHRONIC_AUTHORITY_DEVELOPMENT
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [rabbinic-judaism]
    supporting_sources:
      - {source_id: SCH-JAFFEE-2001-TORAH-MOUTH, locator: "book abstract and chapters 4-6", relation: SCHOLARLY_RECONSTRUCTION, access_mode: PUBLISHER_ABSTRACTS}
    opposing_sources: []
    confidence: high-for-development-unresolved-for-each-stage
    contested: true

  - id: CLM-MISHNAH-RESURRECTION-WORLD-TO-COME
    proposition: "Mishnah Sanhedrin 10:1 treats a share in the World to Come and resurrection from the Torah as important boundary claims."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [rabbinic-judaism]
    supporting_sources:
      - {source_id: SRC-MISHNAH-SANHEDRIN-10-1, locator: "10:1", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_EDITION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-SINGLE-DATE-PARTING-WAYS-UNSUPPORTED
    proposition: "A single universal date at which Judaism and Christianity became two cleanly separated religions is not established by the evidence represented in this corpus."
    claim_type: NEGATIVE_HISTORICAL_RECONSTRUCTION
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [early-christianity, rabbinic-judaism]
    supporting_sources:
      - {source_id: SRC-IGNATIUS-MAGNESIANS, locator: "anti-Judaizing boundary rhetoric", relation: BOUNDARY_STILL_CONTESTED, access_mode: DIGITAL_TRANSLATION}
