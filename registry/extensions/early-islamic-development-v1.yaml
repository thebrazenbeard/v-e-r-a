claim_additions:
  - id: CLM-EARLY-ISLAM-MULTILAYER-SOURCE-SYSTEM
    proposition: "Historical reconstruction of early Islam requires distinguishing Quranic, documentary/material, early external, sira-maghazi, hadith, legal, state, and later confessional evidence layers rather than flattening them into one contemporaneous source corpus."
    claim_type: HISTORIOGRAPHIC_METHOD
    evidence_class: [PROJECT_INFERENCE, SCHOLARLY_INTERPRETATION]
    traditions: [early-islam]
    supporting_sources:
      - {source_id: SCH-ANTHONY-2020-MUHAMMAD-EMPIRES, locator: "book structure", relation: SOURCE_LAYERING_MODEL, access_mode: PUBLISHER_SUMMARY}
      - {source_id: SCH-HOYLAND-2006-DOCUMENTARY-STATE, locator: "abstract", relation: DOCUMENTARY_INDEPENDENCE, access_mode: PUBLISHER_ABSTRACT}
      - {source_id: SCH-OXFORD-BIB-HADITH, locator: "collection/authenticity 632-900 section", relation: HADITH_FORMATION_HISTORY, access_mode: PUBLISHER_REFERENCE}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-ANTHONY-SIRA-PRE-IBN-ISHAQ-LAYERS
    proposition: "The early Muslim biographical tradition is not reducible to the surviving Ibn Hisham recension of Ibn Ishaq; earlier and parallel sira-maghazi materials and source layers can be historically investigated."
    claim_type: SOURCE_HISTORY
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [early-islam, sira-maghazi]
    supporting_sources:
      - {source_id: SCH-ANTHONY-2020-MUHAMMAD-EMPIRES, locator: "Parts I-II and author summary", relation: SCHOLARLY_RECONSTRUCTION, access_mode: PUBLISHER_SUMMARY}
    opposing_sources: []
    confidence: high-for-author-position
    contested: true

  - id: CLM-HOYLAND-DOCUMENTS-UNDERUSED-EARLY-STATE
    proposition: "Papyri, coins, rock inscriptions and related documents provide an independent evidentiary lane for the early Islamic state and have historically been underused relative to later literary narratives."
    claim_type: HISTORIOGRAPHIC_METHOD
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [early-islam, state-formation]
    supporting_sources:
      - {source_id: SCH-HOYLAND-2006-DOCUMENTARY-STATE, locator: "abstract", relation: DIRECT_AUTHOR_ARGUMENT, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high-for-author-position
    contested: false

  - id: CLM-ABD-AL-MALIK-PUBLIC-ISLAMIC-MESSAGING
    proposition: "Surviving material evidence shows substantially clearer recognizably Islamic public messaging under Abd al-Malik, while the historical meaning of that visibility change remains a reconstruction problem rather than proof that Islam originated in his reign."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [early-islam, umayyad]
    supporting_sources:
      - {source_id: MAT-DOME-ROCK-INSCRIPTION-691-692, locator: "monumental inscription", relation: CONTEMPORARY_PUBLIC_ARTICULATION, access_mode: SCHOLARLY_EPIGRAPHIC_ACCESS}
      - {source_id: SCH-HOYLAND-2006-DOCUMENTARY-STATE, locator: "abstract", relation: DOCUMENTARY_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high-for-visibility-change-moderate-for-causal-explanation
    contested: true

  - id: CLM-HADITH-HAS-COLLECTION-AUTHENTICITY-HISTORY
    proposition: "The hadith corpus has a historically extended collection, transmission, forgery-detection, isnad-criticism and canonization history, so collection date and claimed event date must be represented separately."
    claim_type: SOURCE_HISTORY
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [early-islam, hadith]
    supporting_sources:
      - {source_id: SCH-OXFORD-BIB-HADITH, locator: "collection/authenticity 632-900 CE", relation: SCHOLARLY_REFERENCE_SYNTHESIS, access_mode: PUBLISHER_REFERENCE}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-ISLAMIC-LEGAL-SCHOOLS-FORM-HISTORICALLY
    proposition: "Mature Islamic legal schools and formal legal theory emerge through a historical development involving earlier judges, legal specialists, prophetic authority and changing legal reasoning rather than existing in fully developed form at Muhammad's death."
    claim_type: INSTITUTIONAL_AND_INTELLECTUAL_HISTORY
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [early-islam, islamic-law]
    supporting_sources:
      - {source_id: SCH-HALLAQ-ORIGINS-ISLAMIC-LAW, locator: "chapters 3-7 sequence", relation: SCHOLARLY_RECONSTRUCTION, access_mode: PUBLISHER_SUMMARY}
    opposing_sources: []
    confidence: high-for-broad-development
    contested: true

  - id: CLM-SUNNI-SHII-MATURE-BINARY-NOT-632
    proposition: "The succession disputes beginning after Muhammad's death are early antecedents of later Sunnism and Shiism, but the mature confessional identities and boundaries developed historically and cannot be projected unchanged into 632."
    claim_type: CONFESSIONAL_FORMATION_HISTORY
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [early-islam, sunnism, shiism]
    supporting_sources:
      - {source_id: SCH-MATTHIESEN-2023-CALIPH-IMAM, locator: "Part I and conclusion framework", relation: LONG_TERM_CONFESSIONAL_HISTORY, access_mode: PUBLISHER_ABSTRACT_EXTRACT}
    opposing_sources: []
    confidence: high-for-broad-development
    contested: true

