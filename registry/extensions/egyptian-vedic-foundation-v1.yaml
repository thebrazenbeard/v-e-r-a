claim_additions:
  - id: CLM-EGYPT-RELIGION-DIACHRONIC-PLURAL
    proposition: "Ancient Egyptian religion is a long-duration family of changing local, royal, funerary and temple systems and should not be represented as one timeless systematic theology."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [ancient-egyptian]
    supporting_sources:
      - {source_id: SCH-MET-DIVINE-EGYPT, locator: "curatorial synthesis", relation: PERIOD_AND_FUNCTION_CONTEXT, access_mode: INSTITUTIONAL_PUBLIC_PAGE}
    opposing_sources: []
    confidence: high-at-broad-level
    contested: false

  - id: CLM-EGYPT-MAAT-ORDER-JUDGMENT
    proposition: "Maat connects proper cosmic order with Egyptian religious and postmortem judgment traditions, including the weighing of the heart in New Kingdom and later funerary evidence."
    claim_type: RELIGIOUS_CONCEPT_HISTORY
    evidence_class: [MATERIAL_EVIDENCE, PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [ancient-egyptian]
    supporting_sources:
      - {source_id: MAT-EGYPT-BOD-TIYE, locator: "funerary papyrus context", relation: MATERIAL_FUNERARY_WITNESS, access_mode: MUSEUM_OBJECT_RECORD}
      - {source_id: SCH-MET-DIVINE-EGYPT, locator: "Maat / cosmic order", relation: CURATORIAL_SYNTHESIS, access_mode: INSTITUTIONAL_PUBLIC_PAGE}
    opposing_sources: []
    confidence: high-for-broad-concept
    contested: false

  - id: CLM-RIGVEDA-RITUAL-CENTRAL
    proposition: "Rigvedic hymn composition is deeply embedded in ritual performance, especially fire, Soma, offering, priestly recitation and sacrificial patronage."
    claim_type: RELIGIOUS_SYSTEM_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [vedic]
    supporting_sources:
      - {source_id: SCH-JAMISON-BRERETON-RIGVEDA-2020, locator: "chapter 6 Ritual", relation: SCHOLARLY_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-RIGVEDA-KARMA-REBIRTH-ABSENT
    proposition: "Mature doctrines of karma and rebirth are absent from the Rigveda; its principal afterlife imagery instead includes Yama and the ancestors."
    claim_type: NEGATIVE_TEXTUAL_HISTORICAL_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [vedic]
    supporting_sources:
      - {source_id: SCH-JAMISON-BRERETON-RIGVEDA-2020, locator: "chapter 8 Eschatology", relation: DIRECT_SCHOLARLY_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high-for-scholar-position
    contested: false

  - id: CLM-UPANISHAD-KARMA-REBIRTH-LIBERATION-DEVELOP
    proposition: "Early Upanishadic traditions are major witnesses to the historical emergence and development of rebirth, karma and liberation-oriented religious ideas in ancient India."
    claim_type: DIACHRONIC_RELIGIOUS_DEVELOPMENT
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [upanishadic, brahmanical]
    supporting_sources:
      - {source_id: SCH-OLIVELLE-UPANISADS-1998, locator: "Introduction", relation: HISTORICAL_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
      - {source_id: SCH-COHEN-UPANISADS-2024, locator: "Central Ideas", relation: CONCEPTUAL_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high-at-broad-level
    contested: false

  - id: CLM-MAAT-RTA-STRUCTURAL-PARALLEL
    proposition: "Egyptian maat and Vedic rta exhibit a real structural parallel as concepts linking correct human/ritual action with wider cosmic order, but current evidence does not establish equivalence or direct historical lineage."
    claim_type: COMPARATIVE_STRUCTURE
    evidence_class: [PROJECT_INFERENCE, SCHOLARLY_INTERPRETATION]
    traditions: [ancient-egyptian, vedic, comparative]
    supporting_sources:
      - {source_id: SCH-MET-DIVINE-EGYPT, locator: "Maat / cosmic order", relation: EGYPTIAN_CONTROL, access_mode: INSTITUTIONAL_PUBLIC_PAGE}
      - {source_id: SCH-JAMISON-BRERETON-RIGVEDA-2020, locator: "ritual/gods/poetics chapters", relation: VEDIC_CONTROL, access_mode: PUBLISHER_ABSTRACTS}
    opposing_sources: []
    confidence: moderate-for-structural-parallel
    contested: true
    notes:
      - "No transmission edge is created in V1."

