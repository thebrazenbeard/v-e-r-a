claim_additions:
  - id: CLM-ENOCH-WATCHERS-EVIL-ETIOLOGY
    proposition: "The Book of the Watchers develops Genesis 6:1-4 into an account connecting rebellious heavenly beings, illicit human unions, forbidden knowledge, giant violence, divine judgment, and later giant-spirit demon etiology."
    claim_type: TEXTUAL_AND_LITERARY_DEVELOPMENT
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [second-temple-judaism, enochic]
    supporting_sources:
      - source_id: SRC-1ENOCH-WATCHERS
        locator: "1 Enoch 6-16 tradition complex"
        relation: PRIMARY_TEXT_TRADITION
        access_mode: SCHOLARLY_RECONSTRUCTION_IN_V1
      - source_id: SCH-STOKES-2019-SATANOLOGY-WATCHERS
        locator: "Book of Watchers analysis"
        relation: SCHOLARLY_LAYERING_AND_DEMON_ETIOLOGY
        access_mode: PUBLISHER_ACCESS
    opposing_sources: []
    confidence: high-for-developed-tradition-moderate-for-layer-sequence
    contested: true

  - id: CLM-DANIEL-APOCALYPTIC-EMPIRE-JUDGMENT
    proposition: "Daniel 7-12 transforms imperial crisis into apocalyptic history involving symbolic empires, heavenly judgment, angelic princes, divine deliverance, and final vindication."
    claim_type: TEXTUAL_SYSTEM_SUMMARY
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [second-temple-judaism, danielic]
    supporting_sources:
