      - source_id: SCH-OCD-2022-DANIEL
        locator: "reference article"
        relation: HISTORICAL_SYNTHESIS
        access_mode: PUBLISHER_SUMMARY
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DANIEL12-RESURRECTION
    proposition: "Daniel 12:2-3 explicitly describes many sleepers in the dust awakening to differentiated enduring destinies and the wise/righteous receiving star-like radiance."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [second-temple-judaism, resurrection]
    supporting_sources:
      - source_id: SRC-DANIEL-7-12
