    confidence: unresolved
    contested: true

  - id: CLM-JOHN-8-41-SUPPORTS-PANTHERA-BIOLOGICAL-PATERNITY
    proposition: "John 8:41 independently supports Panthera/Pandera as the biological father of the historical Jesus/Yeshua."
    claim_type: HISTORICAL_BIOGRAPHY
    evidence_class: [UNKNOWN]
    traditions: [comparative]
    supporting_sources: []
    opposing_sources:
      - source_id: SRC-GOSPEL-JOHN
