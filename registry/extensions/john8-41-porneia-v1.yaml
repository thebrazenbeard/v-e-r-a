        relation: ARGUES_VERSE_IS_NOT_SOLID_EVIDENCE_FOR_FIRST_CENTURY_REJECTION_OF_VIRGIN_BIRTH
        access_mode: ACCESSIBLE_CHAPTER_COPY
      - source_id: SRC-GOSPEL-JOHN
