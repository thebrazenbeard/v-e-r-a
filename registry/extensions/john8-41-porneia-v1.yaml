claim_additions:
  - id: CLM-JOHN-8-41-PORNEIA-ONE-FATHER
    proposition: "John 8:41 has Jesus's interlocutors deny that they were born from porneia and claim one Father, God, within an extended dispute about Abrahamic and divine paternity."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [christianity]
    supporting_sources:
      - source_id: SRC-GOSPEL-JOHN
        locator: "John 8:31-47; focal verse 8:41"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: MODERN_CRITICAL_TEXT_AND_TRANSLATION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-JOHN-8-41-IMPLIED-PERSONAL-TAUNT
    proposition: "The emphatic denial 'we were not born from porneia' in John 8:41 carries an implied contrast directed at Jesus, approximately 'we were not, unlike you'."
    claim_type: RHETORICAL_INFERENCE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [christianity, historical-jesus]
    supporting_sources:
      - source_id: SCH-HARLOW-2012-BORN-FORNICATION
        locator: "John 8:41 discussion"
        relation: ALLOWS_RHETORICAL_SUBTEXT_WITHOUT_FIXING_TYPE_OF_PORNEIA
        access_mode: ACCESSIBLE_CHAPTER_COPY
    opposing_sources: []
    confidence: plausible-but-underdetermined
    contested: true
    notes:
      - "Even on Harlow's analysis, the rhetorical subtext does not establish that literal sexual immorality rather than spiritual/covenantal infidelity is intended."

  - id: CLM-JOHN-8-41-SPIRITUAL-PATERNITY-READING
    proposition: "John 8:41 is best explained in its immediate literary context as a claim of spiritual/covenantal legitimacy rather than a literal accusation about Jesus's biological conception."
    claim_type: LITERARY_SEMANTIC_INTERPRETATION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [christianity]
    supporting_sources:
      - source_id: SCH-HARLOW-2012-BORN-FORNICATION
        locator: "John 8:41 analysis and conclusion"
        relation: ARGUES_FOR_SPIRITUAL_LEGITIMACY_READING
        access_mode: ACCESSIBLE_CHAPTER_COPY
      - source_id: SRC-GOSPEL-JOHN
        locator: "John 8:39-47"
        relation: IMMEDIATE_CONTEXT_SPIRITUALIZES_PATERNITY_AND_CULMINATES_IN_FATHER_THE_DEVIL
        access_mode: MODERN_CRITICAL_TEXT_AND_TRANSLATION
    opposing_sources: []
    confidence: strong-scholarly-case-not-project-fact
    contested: true

  - id: CLM-ORIGEN-COMMENTARY-JOHN-READS-8-41-AS-BIRTH-SLUR
    proposition: "Origen's Commentary on John 20.128-130 interprets John 8:41 as a veiled slur concerning Jesus's virgin birth; Harlow identifies it as the earliest surviving commentary to do so."
    claim_type: RECEPTION_HISTORY
    evidence_class: [LATER_TRADITION, SCHOLARLY_INTERPRETATION]
    traditions: [christianity, jewish-christian-relations]
    supporting_sources:
      - source_id: SRC-ORIGEN-COMMENTARY-JOHN
        locator: "Commentary on John 20.128-130"
        relation: PRIMARY_RECEPTION_TEXT_EXACT_LOCATOR_REPORTED_BY_SCHOLARSHIP
        access_mode: EXACT_LOCATOR_THROUGH_HARLOW_QUOTING_HEINE
      - source_id: SCH-HARLOW-2012-BORN-FORNICATION
        locator: "discussion of Commentary on John 20.128-130"
        relation: SCHOLARLY_SOURCE_IDENTIFICATION_AND_ANALYSIS
        access_mode: ACCESSIBLE_CHAPTER_COPY
    opposing_sources: []
    confidence: high-for-locator-and-harlows-report-greek-collation-pending
    contested: false
    notes:
      - "This is reception-history evidence. It is not evidence that the same reading was present in the first-century Johannine setting."
      - "Harlow notes that Origen himself says a literal reading of the phrase fits neither the preceding nor following context cleanly before proposing the veiled insult."

  - id: CLM-JOHN-8-41-PROVES-FIRST-CENTURY-ILLEGITIMACY-RUMOR
    proposition: "John 8:41 independently establishes that first-century Jews knew and circulated a literal sexual-illegitimacy claim about Jesus's birth."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [UNKNOWN]
    traditions: [comparative]
