concept_additions:
  - id: CON-CHALCEDON-TWO-NATURES
    label: Chalcedonian two-natures formula
    canonical_label: Chalcedonian two-natures formula
    kind: christological-formula
    forms: [Chalcedonian two-natures formula]
    semantic_guard: "Records the conciliar Christological formula; it does not by itself establish earlier Christian consensus or the metaphysical truth of the formula."
    traditions: [late-antique-christianity, chalcedonian]
    definition: "Conciliar Christological formula confessing one Christ in two natures without confusion, change, division, or separation."
    linked_claims: [CLM-CHALCEDON-TWO-NATURES-DEFINITION]
    relations: []

  - id: CON-SOUTH-ARABIAN-RAHMANAN
    label: Rahmanan divine epithet in Late Antique South Arabia
    canonical_label: Rahmanan divine epithet in Late Antique South Arabia
    kind: divine-epithet-concept
    forms: [Rahmanan]
    semantic_guard: "Do not equate every Rahmanan attestation with Qur'anic al-Rahman or assume one unchanged theology across Jewish, monotheist, and Christian South Arabian contexts."
    traditions: [late-antique-arabia]
    definition: "Divine title/name attested in South Arabian monotheist contexts whose community-specific theological referent changes across Jewish/monotheist and Christian political phases."
    linked_claims: [CLM-RAHMANAN-CROSSES-MONOTHEIST-CONTEXTS]
    relations: []

claim_additions:
  - id: CLM-CHALCEDON-TWO-NATURES-DEFINITION
    proposition: "The 451 Council of Chalcedon normatively defines one and the same Christ to be acknowledged in two natures without confusion, change, division, or separation."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [late-antique-christianity, chalcedonian]
    supporting_sources:
      - {source_id: SRC-CHALCEDON-DEFINITION-451, locator: "Definition of Faith", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: PUBLIC_TRANSLATION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-LATE-ANTIQUE-CHRISTIANITY-REMAINS-PLURAL
    proposition: "Imperial councils and enforcement did not produce uniform Christian acceptance; Chalcedonian, miaphysite, Church-of-the-East and other regional Christian configurations remained institutionally significant."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [late-antique-christianity]
    supporting_sources:
      - {source_id: SCH-ALLEN-2008-ORTHODOXY-ENFORCEMENT, locator: "summary", relation: IMPERIAL_ENFORCEMENT_EVIDENCE, access_mode: PUBLISHER_SUMMARY}
      - {source_id: SCH-MENZE-2025-CHRISTIAN-NEAR-EAST, locator: "abstract", relation: REGIONAL_PLURALITY_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-CHURCH-EAST-SASANIAN-INSTITUTIONAL-PRESENCE
    proposition: "The Church of the East became a recognized, institutionally significant Christian tradition within the Sasanian world rather than remaining only a marginal persecuted sect."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [church-of-the-east, sasanian-iran]
    supporting_sources:
      - {source_id: SCH-WALKER-2012-CHURCH-EAST, locator: "abstract", relation: INSTITUTIONAL_HISTORY_SYNTHESIS, access_mode: PUBLISHER_ABSTRACT}
    opposing_sources: []
    confidence: high-at-broad-level
    contested: false

  - id: CLM-SASANIAN-RELIGIOUS-LANDSCAPE-PLURAL
    proposition: "The Sasanian religious field included organized Zoroastrian institutions together with substantial Christian, Jewish, Manichaean and other communities whose status changed over time."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sasanian-iran]
    supporting_sources:
      - {source_id: MAT-KARTIR-SASANIAN-INSCRIPTIONS, locator: "third-century priestly inscriptions", relation: ZOROASTRIAN_INSTITUTIONAL_EVIDENCE, access_mode: SCHOLARLY_TRANSCRIPTION}
