claim_additions:
  - id: CLM-MARK-6-3-MATRONYMIC-CRITICAL-TEXT
    proposition: "The mainstream critical text of Mark 6:3 identifies Jesus as 'the carpenter, the son of Mary' without a corresponding patronymic in the clause."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [christianity]
    supporting_sources:
      - source_id: SRC-GOSPEL-MARK
        locator: "Mark 6:3"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: MODERN_CRITICAL_TEXT
      - source_id: SCH-NORMAN-2025-MARK-MATRONYMIC
        locator: "Part I: Jesus 'the Son of Mary' in Mk 6.3"
        relation: CRITICAL_TEXT_AND_VARIANT_DISCUSSION
        access_mode: OPEN_ACCESS_PUBLISHER_FULL_TEXT
    opposing_sources: []
    confidence: high-at-critical-text-level
    contested: false
    notes:
      - "The confidence applies to the mainstream critical-text reading, not to the claim that no early alternative existed."

  - id: CLM-MARK-6-3-EARLY-CARPENTERS-SON-VARIANT
    proposition: "An early textual variant of Mark 6:3 reads toward 'the son of the carpenter and of Mary'; P45 is commonly reconstructed as belonging to this variant family."
    claim_type: TEXTUAL_VARIANT_REPORT
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION]
    traditions: [christianity]
    supporting_sources:
      - source_id: SRC-GOSPEL-MARK
        witness_id: WIT-P45-MARK-6-3
        locator: "Mark 6:3 variation unit"
        relation: PUBLISHED_APPARATUS_RECONSTRUCTION
        access_mode: SCHOLARLY_APPARATUS_SUMMARY
      - source_id: SCH-NORMAN-2025-MARK-MATRONYMIC
        locator: "textual discussion of Mark 6:3"
        relation: SCHOLARLY_TEXTUAL_CRITICISM
        access_mode: OPEN_ACCESS_PUBLISHER_FULL_TEXT
    opposing_sources: []
    confidence: high-for-existence-of-variant-moderate-for-fragmentary-p45-reconstruction
    contested: false
    notes:
      - "The variant's existence and P45's fragmentary state are distinct from deciding the original reading."

  - id: CLM-SYNOPTIC-HOMETOWN-PATERNITY-LABELS-DIFFER
    proposition: "In the compared hometown passages, Mark 6:3 uses 'son of Mary', Matthew 13:55 uses 'the carpenter's son' and names Mary separately, and Luke 4:22 uses 'Joseph's son'."
    claim_type: TEXTUAL_COMPARISON
    evidence_class: [PRIMARY_TEXT]
    traditions: [christianity]
    supporting_sources:
      - source_id: SRC-GOSPEL-MARK
        locator: "Mark 6:3"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: MODERN_CRITICAL_TEXT
      - source_id: SRC-GOSPEL-MATTHEW
        locator: "Matthew 13:55"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: MODERN_GREEK_TEXT
      - source_id: SRC-GOSPEL-LUKE
        locator: "Luke 4:22"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: MODERN_GREEK_TEXT
    opposing_sources: []
    confidence: high
    contested: false
    notes:
      - "The wording difference is direct textual evidence; the motive for the difference is a separate interpretive question."

  - id: CLM-MARK-6-3-MATRONYMIC-IS-ILLEGITIMACY-SLUR
    proposition: "The phrase 'son of Mary' in Mark 6:3 specifically functions as a paternity/illegitimacy slur in the Nazareth scene."
    claim_type: SEMANTIC_SOCIAL_INFERENCE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [christianity, historical-jesus]
    supporting_sources:
      - source_id: SCH-CROY-2022-ESCAPING-SHAME
        locator: "pp. 99-107 as identified in Norman 2025"
        relation: ARGUES_FOR_CONTEXTUAL_SLUR_READING
        access_mode: SCHOLARLY_SUMMARY_AND_BOOK_METADATA
    opposing_sources:
      - source_id: SCH-MCARTHUR-1973-SON-OF-MARY
        locator: "conclusion summarized by Norman 2025"
        relation: ARGUES_INFORMAL_IDENTIFICATION_NEED_NOT_CARRY_SPECIAL_STIGMA
        access_mode: SCHOLARLY_SUMMARY
      - source_id: SCH-ILAN-1992-METRONYMES
        locator: "position summarized by Norman 2025"
        relation: MATRONYMICS_DO_NOT_ENCODE_SINGLE_ILLEGITIMACY_RULE
        access_mode: SCHOLARLY_SUMMARY
      - source_id: SCH-NORMAN-2025-MARK-MATRONYMIC
        locator: "Part I and new solution"
        relation: OFFERS_ALTERNATIVE_GREEK_LITERARY_WOMENS_SPEECH_MODEL
        access_mode: OPEN_ACCESS_PUBLISHER_FULL_TEXT
    confidence: unresolved
    contested: true
    notes:
      - "Narrative hostility increases plausibility of a disparaging reading but does not independently identify the semantic target of the insult."

  - id: CLM-MARK-6-3-PROVES-FIRST-CENTURY-PATERNITY-RUMOR
    proposition: "Mark 6:3 by itself establishes that a first-century Nazareth rumor questioned Jesus's biological paternity."
    claim_type: HISTORICAL_RECONSTRUCTION
    evidence_class: [UNKNOWN]
    traditions: [comparative]
    supporting_sources: []
    opposing_sources:
      - source_id: SCH-NORMAN-2025-MARK-MATRONYMIC
        locator: "survey of multiple explanations"
        relation: MULTIPLE_LIVE_INTERPRETATIONS_PREVENT_UNIQUE_HISTORICAL_INFERENCE
        access_mode: OPEN_ACCESS_PUBLISHER_FULL_TEXT
    confidence: unresolved
    contested: true
    notes:
      - "A possible slur reading is not equivalent to evidence that the crowd's exact historical wording or a specific paternity rumor has been recovered."

  - id: CLM-MARK-6-3-SUPPORTS-PANTHERA-BIOLOGICAL-PATERNITY
    proposition: "Mark 6:3 independently supports Panthera/Pandera as the biological father of the historical Jesus/Yeshua."
    claim_type: HISTORICAL_BIOGRAPHY
    evidence_class: [UNKNOWN]
    traditions: [comparative]
    supporting_sources: []
    opposing_sources:
      - source_id: SRC-GOSPEL-MARK
        locator: "Mark 6:3"
        relation: TEXT_DOES_NOT_NAME_PANTHERA_OR_AN_ALTERNATIVE_FATHER
        access_mode: MODERN_CRITICAL_TEXT
    confidence: unresolved
    contested: true
    notes:
      - "Using later Panthera traditions to fix the meaning of Mark 6:3 and then counting Mark as independent confirmation would be circular."

