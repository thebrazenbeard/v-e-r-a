claim_additions:
  - id: CLM-PANTHERA-PARTHENOS-POLEMICAL-WORDPLAY
    proposition: "The Panthera/Pandera name attached to Jesus was deliberately selected or distorted as a polemical echo of Greek parthenos, mocking Christian virgin-birth language."
    claim_type: LINGUISTIC_SOURCE_PROVENANCE
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [judaism, christianity, greco-roman]
    supporting_sources:
      - source_id: SCH-BOYARIN-1998-PANTHERA-WORDPLAY
        locator: "pp. 599-600, note 69"
        relation: STRONGLY_ARGUES_INTENTIONAL_DISTORTION_CACOPHEMISM
        access_mode: AUTHOR_UPLOADED_FULL_TEXT
      - source_id: SCH-JAFFE-2008-BEN-PANTERA
        locator: "article-level polemical-function argument"
        relation: SUPPORTS_MOCKING_POLEMICAL_FUNCTION
        access_mode: REPOSITORY_RECORD_AND_ABSTRACT
    opposing_sources:
      - source_id: SCH-BLUMELL-2007-CELSUS-JEW
        locator: "note/discussion of Panthera name origin"
        relation: TREATS_WORDPLAY_VERSUS_ACTUAL_FIGURE_AS_UNCERTAIN
        access_mode: PUBLISHER_ARTICLE
      - source_id: SCH-MURCIA-2014-PANTHERA-ORIGIN
        locator: "status quaestionis on name origin"
        relation: MULTIPLE_COMPETING_ORIGIN_MODELS_EXIST
        access_mode: PUBLISHER_METADATA_AND_TABLE_OF_CONTENTS
    confidence: plausible-unresolved
    contested: true
    alternatives:
      - "Panthera entered the polemic as an independently existing personal name without derivation from parthenos."
      - "An existing Panthera name was selected precisely because it enabled a parthenos joke."
      - "The name-family has another polemical, familial, or transmission origin later reinterpreted through parthenos."

