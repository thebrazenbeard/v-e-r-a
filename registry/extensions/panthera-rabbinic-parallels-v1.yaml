claim_additions:
  - id: CLM-SANHEDRIN-STADA-PANDEIRA-MIRIAM
    proposition: "Sanhedrin 67a:14-15 relates a ben Setada execution tradition in Lod on Passover eve and follows it with a ben Pandeira/Miriam name discussion; the checked passage itself does not explicitly name Jesus/Yeshua."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT, LATER_TRADITION]
    traditions: [rabbinic-judaism]
    supporting_sources:
      - source_id: SRC-BAVLI-SANHEDRIN-67A
        locator: "Sanhedrin 67a:14-15"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: DIGITAL_TEXT_EDITION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-TOSEFTA-VIENNA-YESHUA-PANTEIRA-VARIANT
    proposition: "The checked Sefaria manuscript-aware display for Tosefta Chullin 2:6 reports that the Vienna manuscript adds the name-form 'Yeshua ben Panteira' in both the ben Dama healing episode and the Rabbi Eliezer heresy episode."
    claim_type: TEXTUAL_VARIANT_REPORT
    evidence_class: [PRIMARY_TEXT, LATER_TRADITION]
    traditions: [rabbinic-judaism, jewish-christian-relations]
    supporting_sources:
      - source_id: SRC-TOSEFTA-CHULLIN-2-6
        witness_id: WIT-TOSEFTA-VIENNA-COD-HEBR-20
        locator: "Tosefta Chullin 2:6; Vienna manuscript annotation in Sefaria"
        relation: DIGITAL_EDITION_VARIANT_REPORT
        access_mode: DIGITAL_EDITION_WITH_MANUSCRIPT_LAYER
    opposing_sources: []
    confidence: high-for-digital-edition-report
    contested: false
    notes:
      - "This confidence applies to Sefaria's report of the Vienna reading, not to the proposition that V1 independently transcribed the codex."

  - id: CLM-YERUSHALMI-HEALING-YESHUA-PANDERA
    proposition: "The checked Jerusalem Talmud passages preserve healing traditions that explicitly invoke Jesus/Yeshua with Pandera/Pantera name-forms."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT, LATER_TRADITION]
    traditions: [rabbinic-judaism, jewish-christian-relations]
