        locator: "Shabbat 14:4:8 and 14:4:12"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: DIGITAL_TEXT_EDITION
    opposing_sources: []
    confidence: high-at-digital-text-level
    contested: false
    notes:
      - "Parallel passages may share textual/traditional dependence and are not automatically independent historical witnesses."

