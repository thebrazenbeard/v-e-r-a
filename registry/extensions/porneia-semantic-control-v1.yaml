claim_additions:
  - id: CLM-LXX-HOSEA-PORNEIA-COVENANT-INFIDELITY
    proposition: "The Septuagint of Hosea 1:2 uses the porneia word-family in a sign-act whose stated referent is the land's departure from the Lord, demonstrating covenant-infidelity metaphorical usage."
    claim_type: TEXTUAL_SEMANTIC_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [septuagint, judaism]
    supporting_sources:
      - source_id: SRC-LXX-HOSEA
        locator: "Hosea 1:2"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: MODERN_DIGITAL_GREEK_TEXT
    opposing_sources: []
    confidence: high
    contested: false
    notes:
      - "This demonstrates a nonexclusive metaphorical semantic use; it does not prove that every later porneia occurrence is metaphorical."

