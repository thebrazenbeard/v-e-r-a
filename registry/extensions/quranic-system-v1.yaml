concept_additions:
  - id: CON-QURAN-DIVINE-UNIQUENESS
    label: Qur'anic divine uniqueness and incomparability
    canonical_label: Qur'anic divine uniqueness and incomparability
    kind: theological-proposition-cluster
    forms: [Qur'anic divine uniqueness and incomparability]
    semantic_guard: "Records a Qur'anic proposition cluster; do not collapse it into every other monotheist formulation of divine unity or incomparability."
    traditions: [quranic]
    definition: "Qur'anic proposition cluster presenting Allah as uniquely worthy of worship, unbegotten/unbegetting and without comparable equal."
    linked_claims: [CLM-QURAN-DIVINE-UNIQUENESS]
    relations: []

  - id: CON-QURAN-JINN
    label: Qur'anic jinn
    canonical_label: Qur'anic jinn
    kind: nonhuman-being-class
    forms: [jinn]
    semantic_guard: "Do not collapse the Qur'anic jinn class into angels, demons, or a morally uniform category."
    traditions: [quranic]
    definition: "Qur'anic class of nonhuman beings including morally/religiously diverse members capable of hearing and responding to revelation."
    linked_claims: [CLM-QURAN-JINN-MORAL-DIVERSITY, CLM-QURAN-IBLIS-OF-JINN]
    relations: []

  - id: CON-QURAN-IBLIS
    label: Qur'anic Iblis
    canonical_label: Qur'anic Iblis
    kind: named-religious-figure
    forms: [Iblis]
    semantic_guard: "Do not equate the entire jinn class with Iblis or import later demonological categories into the Qur'anic concept without separate evidence."
    traditions: [quranic]
    definition: "Named rebel in Qur'anic Adam-prostration narratives, explicitly identified as being of the jinn in Q 18:50."
    linked_claims: [CLM-QURAN-IBLIS-OF-JINN]
    relations:
      - {relation: MEMBER_OF_EXPLICIT_TEXTUAL, target_concept_id: CON-QURAN-JINN, confidence: high, guard: "Do not equate the entire jinn class with Iblis or later demon categories."}

  - id: CON-QURAN-PROPHETIC-REVELATION-CONTINUUM
    label: Qur'anic prophetic revelation continuum
    canonical_label: Qur'anic prophetic revelation continuum
    kind: revelation-history-concept
    forms: [Qur'anic prophetic revelation continuum]
    semantic_guard: "The Qur'an's placement of itself within a wider prophetic history does not by itself establish direct textual dependence or uninterrupted institutional continuity."
    traditions: [quranic]
    definition: "Qur'anic presentation of its revelation within a wider history of messages/scriptures associated with Abrahamic and other prophetic figures."
    linked_claims: [CLM-QURAN-PROPHETIC-CONTINUUM, CLM-QURAN-CONFIRMS-CRITERION-PRIOR-SCRIPTURE]
    relations: []

  - id: CON-QURAN-RESURRECTION-JUDGMENT
    label: Qur'anic resurrection and judgment
    canonical_label: Qur'anic resurrection and judgment
    kind: eschatological-concept
    forms: [Qur'anic resurrection and judgment]
    semantic_guard: "Do not treat this Qur'anic eschatological cluster as identical to Jewish or Christian resurrection/judgment models without feature-level comparison."
    traditions: [quranic]
    definition: "Qur'anic eschatological cluster involving bodily restoration/resurrection, divine judgment and reward/punishment."
    linked_claims: [CLM-QURAN-BODILY-RESURRECTION]
    relations: []

claim_additions:
  - id: CLM-QURAN-DIVINE-UNIQUENESS
    proposition: "The Qur'an explicitly presents Allah as one, neither begetting nor begotten, without comparable equal, and as uniquely sovereign over creation."
    claim_type: TEXTUAL_OCCURRENCE_CLUSTER
    evidence_class: [PRIMARY_TEXT]
    traditions: [quranic]
    supporting_sources:
      - {source_id: SRC-QURAN-RECEIVED-TEXT, locator: "Q 112:1-4; Q 2:255; Q 42:11", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_ARABIC_AND_TRANSLATION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-QURAN-IBLIS-OF-JINN
    proposition: "Q 18:50 explicitly identifies Iblis as being of the jinn within the angelic-prostration narrative."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [quranic]
    supporting_sources:
      - {source_id: SRC-QURAN-RECEIVED-TEXT, locator: "Q 18:50", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_ARABIC_AND_TRANSLATION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-QURAN-JINN-MORAL-DIVERSITY
    proposition: "The Qur'an depicts jinn as morally/religiously diverse beings, including jinn who hear the Qur'an and respond with belief."
    claim_type: TEXTUAL_OCCURRENCE_CLUSTER
    evidence_class: [PRIMARY_TEXT]
    traditions: [quranic]
    supporting_sources:
      - {source_id: SRC-QURAN-RECEIVED-TEXT, locator: "Q 72:1-15", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_ARABIC_AND_TRANSLATION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-QURAN-PROPHETIC-CONTINUUM
    proposition: "The Qur'an places its believing community's revelation within a wider sequence including Abraham, Ishmael, Isaac, Jacob, Moses, Jesus and other prophets, and generalizes messenger-sending across communities."
    claim_type: TEXTUAL_OCCURRENCE_CLUSTER
    evidence_class: [PRIMARY_TEXT]
    traditions: [quranic]
    supporting_sources:
      - {source_id: SRC-QURAN-RECEIVED-TEXT, locator: "Q 2:136; Q 3:84; Q 16:36", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_ARABIC_AND_TRANSLATION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-QURAN-CONFIRMS-CRITERION-PRIOR-SCRIPTURE
    proposition: "Q 5:48 presents the Qur'anic Book as revealed in truth, confirming preceding scripture and functioning as a criterion/guardian in relation to it while acknowledging differentiated law/path among communities."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [quranic]
    supporting_sources:
      - {source_id: SRC-QURAN-RECEIVED-TEXT, locator: "Q 5:48", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_ARABIC_AND_TRANSLATION}
    opposing_sources: []
    confidence: high-at-text-level
    contested: true
    notes:
      - "Precise semantics of muhaymin and implications for prior-scripture textual status require lexical and reception-history analysis."

  - id: CLM-QURAN-BODILY-RESURRECTION
    proposition: "The Qur'an explicitly argues that God can reassemble human bones and restore the dead for judgment; resurrection is not reducible to an immortal-soul metaphor in the textual argument."
    claim_type: TEXTUAL_OCCURRENCE_CLUSTER
    evidence_class: [PRIMARY_TEXT]
    traditions: [quranic]
    supporting_sources:
      - {source_id: SRC-QURAN-RECEIVED-TEXT, locator: "Q 75:3-4 and related resurrection passages", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_ARABIC_AND_TRANSLATION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-QURAN-FASTING-PRESCRIBED-WITH-PREDECESSOR-FRAME
    proposition: "Q 2:183 prescribes fasting for the believing community and explicitly frames fasting as also prescribed for those before them."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [quranic]
    supporting_sources:
      - {source_id: SRC-QURAN-RECEIVED-TEXT, locator: "Q 2:183-187", relation: DIRECT_TEXTUAL_SUPPORT, access_mode: DIGITAL_ARABIC_AND_TRANSLATION}
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-QURAN-CANONICAL-ORDER-NOT-PROCLAMATION-CHRONOLOGY
    proposition: "The received canonical sura order should not be treated as a simple chronological sequence of proclamation; proposed inner-Qur'anic chronological sequences are scholarly reconstructions."
    claim_type: TEXTUAL_HISTORY_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [quranic-studies]
    supporting_sources:
