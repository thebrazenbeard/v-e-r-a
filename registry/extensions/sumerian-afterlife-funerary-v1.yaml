claim_additions:
  - id: CLM-UR-MOST-BURIALS-NONROYAL-SIMPLE
    proposition: "The great majority of excavated graves in Ur's cemetery were materially simpler than the small subset Woolley classified as royal."
    claim_type: ARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-UR-ROYAL-CEMETERY-HAFFORD-2018
        locator: "Simple and Royal Graves at Ur"
        relation: ARCHAEOLOGICAL_CORPUS_SYNTHESIS
        access_mode: INSTITUTIONAL_FULL_TEXT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-UR-ROYAL-RETAINER-BURIAL-EXCEPTIONAL
    proposition: "Ur's elite retainer burials represent an exceptional mortuary subset and cannot be treated as the default Sumerian funeral."
    claim_type: EVIDENCE_SCOPE_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, PROJECT_INFERENCE]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: MAT-UR-ROYAL-CEMETERY-HAFFORD-2018
        locator: "16 royal graves among more than 2,000 graves"
        relation: CORPUS_DISTRIBUTION
        access_mode: INSTITUTIONAL_FULL_TEXT
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-UR-RETAINERS-VIOLENT-DEATH-SOME
    proposition: "At least some examined attendants from the Royal Cemetery at Ur died through violent blunt-force trauma rather than the voluntary-poison mechanism proposed by Woolley."
    claim_type: BIOARCHAEOLOGICAL_RECONSTRUCTION
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: SCH-BAADSGAARD-2011-UR-RETAINERS
        locator: "CT analysis of two preserved heads"
        relation: BIOARCHAEOLOGICAL_ANALYSIS
        access_mode: JOURNAL_AND_INSTITUTIONAL_SUMMARY
    opposing_sources: []
    confidence: high-for-examined-individuals
    contested: false
    notes:
      - "This claim is deliberately restricted to examined individuals and does not infer one mechanism for all retainers."

  - id: CLM-UR-NAMMA-LITERARY-UNDERWORLD-ITINERARY
    proposition: "The Death of Ur-Namma depicts a royal underworld itinerary involving offerings to underworld authorities, postmortem status, and a differentiated royal fate."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-DEATH-UR-NAMMA
        locator: "underworld offerings and settlement passages"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: ETCSL_TRANSLATION
    opposing_sources: []
    confidence: high-for-literary-depiction
    contested: false

  - id: CLM-UR-NAMMA-TEXT-NOT-CONTEMPORARY-BURIAL-REPORT
    proposition: "The surviving Death of Ur-Namma literary witnesses are later than Ur-Namma's reign, so the composition cannot by itself establish the contents or exact rites of his historical burial."
    claim_type: SOURCE_HISTORY_CONTROL
    evidence_class: [PRIMARY_TEXT, HISTORICAL_RECONSTRUCTION]
    traditions: [sumerian]
    supporting_sources:
