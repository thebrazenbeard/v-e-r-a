        relation: WITNESS_HISTORY
        access_mode: ETCSL_BIBLIOGRAPHY
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-GILGAMESH-DEATH-HUMAN-MORTALITY
    proposition: "The Death of Gilgamesh presents human mortality as unavoidable while assigning Gilgamesh a distinguished postmortem role among the dead."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-DEATH-GILGAMESH
        locator: "mortality and ghost-governor passages"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: ETCSL_TRANSLATION
    opposing_sources: []
    confidence: high-for-literary-depiction
    contested: false

  - id: CLM-SUMERIAN-NETHERWORLD-DIFFERENTIATED-DEAD
    proposition: "Gilgamesh, Enkidu and the Netherworld depicts materially different conditions among the dead according to descendants, funerary provisioning, manner of death, and other circumstances."
    claim_type: TEXTUAL_SYSTEM_SUMMARY
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-GILGAMESH-ENKIDU-NETHERWORLD
        locator: "questions concerning one to seven sons, no heir, manner of death, and offerings"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: ETCSL_TRANSLATION
    opposing_sources: []
    confidence: high-for-literary-model
    contested: false

  - id: CLM-SUMERIAN-NO-FUNERARY-OFFERINGS-DEPRIVATION
    proposition: "In Gilgamesh, Enkidu and the Netherworld, a spirit without funerary offerings is represented as subsisting on discarded scraps and crumbs."
    claim_type: TEXTUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-GILGAMESH-ENKIDU-NETHERWORLD
        locator: "spirit of him who has no funerary offerings"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: ETCSL_TRANSLATION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-MESOPOTAMIAN-DEAD-KIN-OFFERING-PATTERN
    proposition: "Across broader Mesopotamian evidence, continuing kin care through burial and food/drink offerings is a strong funerary pattern, but its exact form must be period- and source-bounded."
    claim_type: DIACHRONIC_FUNERARY_RECONSTRUCTION
    evidence_class: [SCHOLARLY_INTERPRETATION, HISTORICAL_RECONSTRUCTION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: SCH-KATZ-2007-SUMERIAN-FUNERARY-RITUALS
        locator: "Sumerian Funerary Rituals in Context"
        relation: SCHOLARLY_SYNTHESIS
        access_mode: INSTITUTIONAL_OPEN_ACCESS
      - source_id: SCH-OXFORD-2024-GHOSTS-MESOPOTAMIA
        locator: "family offerings and ghost care"
        relation: DIACHRONIC_REFERENCE_SYNTHESIS
        access_mode: PUBLISHER_ABSTRACT
    opposing_sources: []
    confidence: high-for-broad-pattern
    contested: false

  - id: CLM-LATER-GHOST-EVIDENCE-NOT-EARLY-SUMERIAN-BY-DEFAULT
    proposition: "The rich first-millennium Babylonian and Assyrian evidence for ghosts and anti-ghost ritual cannot be automatically projected backward as Early Dynastic Sumerian practice."
