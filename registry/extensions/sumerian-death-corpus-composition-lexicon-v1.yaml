  - id: CLM-GEN-NETHERWORLD-GIDIM-PERSON-VS-PLACE
    proposition: "In Gilgamesh, Enkidu and the Netherworld, gidim denotes deceased-person/ghost entities while kur and Ganzer provide realm/place vocabulary, requiring person and place semantics to remain type-separated."
