claim_additions:
  - id: CLM-INANA-DESCENT-KUR-GANZER-DISTINCT
    proposition: "In Inana's Descent, kur functions as the repeated broad death-realm term while Ganzer is a named palace/gateway locus within that realm; the two are compositionally distinct."
    claim_type: COMPOSITION_LEVEL_LEXICAL_CONTROL
    evidence_class: [PRIMARY_TEXT, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-INANA-DESCENT
        locator: "c.1.4.1 lines 73-75, 98-100, 117-126"
        relation: DIRECT_COMPOSITIONAL_COOCCURRENCE
        access_mode: ETCSL_TRANSLITERATION_AND_GLOSSING
      - source_id: SCH-EPSD2-KUR-MOUNTAIN
        locator: "kur semantic range"
        relation: LEXICAL_CONTROL
        access_mode: INSTITUTIONAL_DIGITAL_LEXICON
      - source_id: SCH-EPSD2-GANZER-EARTH
        locator: "ganzer semantic range"
        relation: LEXICAL_CONTROL
        access_mode: INSTITUTIONAL_DIGITAL_LEXICON
    opposing_sources: []
    confidence: high
    contested: false

