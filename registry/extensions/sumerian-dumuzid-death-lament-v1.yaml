claim_additions:
  - id: CLM-DUMUZID-DREAM-DEATH-FOREBODING
    proposition: "Dumuzid's Dream explicitly frames its later pursuit through Dumuzid's anticipation of the day of his death and a request that the landscape and family lament him."
    claim_type: TEXTUAL_SYSTEM_SUMMARY
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-DUMUZID-DREAM
        locator: "lines 1-14, especially line 12"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: CDLI_COMPOSITE_AND_ETCSL
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DUMUZID-GALLA-CAPTOR-NOT-GIDIM
    proposition: "Dumuzid's Dream uses gal5-la2/galla for pursuer-captor beings in the death sequence; this entity class must remain distinct from gidim, the deceased-person ghost category."
    claim_type: LEXICAL_TYPE_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-DUMUZID-DREAM
        locator: "lines 59-63, 89-90 and repeated pursuit sequence"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: CDLI_COMPOSITE
      - source_id: SCH-CDLI-Q000347-DUMUZID-DREAM
        locator: "current Q000347 composite"
        relation: CURRENT_DIGITAL_READBACK
        access_mode: CDLI_SCORE
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DUMUZID-DREAM-ARALI-CAPTURE-WITNESS
    proposition: "Dumuzid's Dream places Arali in the hiding/capture sequence, and the current CDLI score has aligned Ur witness P346104 preserving a damaged a-ra-li line in that sequence."
    claim_type: LINE_LEVEL_WITNESS_REVALIDATION
    evidence_class: [PRIMARY_TEXT, MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-DUMUZID-DREAM
        locator: "lines 94, 106, 149-151"
        relation: COMPOSITION_LEVEL_SUPPORT
        access_mode: CDLI_COMPOSITE
      - source_id: SCH-CDLI-Q000347-DUMUZID-DREAM
        locator: "line 149/150 alignment / P346104"
        relation: ALIGNED_WITNESS_CONFIRMATION
        access_mode: CDLI_SCORE
    opposing_sources: []
    confidence: high-with-damaged-witness
    contested: false

  - id: CLM-INANA-BILULU-ARALI-LAMENT
    proposition: "Inana and Bilulu repeatedly places 'house Arali' within the geography in which lament for the dead/absent Dumuzid is uttered, alongside desert, Bad-tibira, Du-shuba, and shepherding country."
    claim_type: LAMENT_TOPOGRAPHY
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-INANA-BILULU
        locator: "lines 1-5 and 166-173"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: ETCSL_TRANSLITERATION_AND_TRANSLATION
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-INANA-BILULU-LIBATION-PROVISIONING
    proposition: "Inana and Bilulu describes a desert rite involving water libation and flour sprinkling for the absent/dead Dumuzid and links it with making him present in the place from which he vanished."
    claim_type: TEXTUAL_RITUAL_OCCURRENCE
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-INANA-BILULU
        locator: "lines 98-110"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: ETCSL_TRANSLATION_AND_GLOSSING
    opposing_sources: []
    confidence: high-for-literary-depiction
    contested: false

  - id: CLM-DUMUZID-ARALI-CROSS-GENRE
    proposition: "Across Dumuzid's Dream and Inana and Bilulu, Arali recurs in Dumuzid-associated death/capture and lament contexts, but the differing genre functions do not justify treating Arali as one universally defined Sumerian underworld location."
    claim_type: CROSS_COMPOSITION_SEMANTIC_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-DUMUZID-DREAM
        locator: "Arali capture/hiding passages"
        relation: DEATH_CAPTURE_CONTEXT
        access_mode: CDLI_COMPOSITE
      - source_id: SRC-INANA-BILULU
        locator: "Arali lament passages"
        relation: LAMENT_CONTEXT
        access_mode: ETCSL
    opposing_sources: []
    confidence: high-for-recurrence-bounded-for-universal-definition
    contested: false

  - id: CLM-DUMUZID-WITNESS-ASYMMETRY
    proposition: "The current digital evidence base for Dumuzid's Dream and Inana and Bilulu is highly asymmetric: Q000347 reports 89 witnesses with 4 aligned, whereas Q000348 currently lists one witness."
