        relation: HISTORIOGRAPHIC_CONTROL
        access_mode: REFERENCE_WORK
    opposing_sources: []
    confidence: medium-high
    contested: true

  - id: CLM-DUMUZID-MANUSCRIPT-CURRENTNESS-BLOCKS-FIXED-ALLEGORY
    proposition: "Because Dumuzi's Dream continued to gain manuscripts and revised reconstruction after the 1972 edition, fixed allegorical readings must remain subordinate to manuscript-level textual currentness."
    claim_type: EDITION_CURRENTNESS_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
