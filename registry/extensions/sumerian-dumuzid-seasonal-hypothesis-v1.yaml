claim_additions:
  - id: CLM-DUMUZID-HALF-YEAR-PRIMARY-TEXT
    proposition: "Inana's Descent explicitly gives Dumuzid and his sister alternating half-year terms, with one staying when demanded and the other released."
    claim_type: PRIMARY_TEXT_TEMPORAL_STRUCTURE
    evidence_class: [PRIMARY_TEXT]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-INANA-DESCENT
        locator: "c.1.4.1 lines 404-410"
        relation: DIRECT_TEXTUAL_SUPPORT
        access_mode: ETCSL_TRANSLATION_AND_GLOSSING
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DUMUZID-HALF-YEAR-NOT-EXPLICIT-VEGETATION
    proposition: "The half-year passage does not itself state that Dumuzid's alternation causes crop death, crop revival, pasture renewal, or a vegetation cycle; those are interpretive bridges."
    claim_type: TEXTUAL_SCOPE_CONTROL
    evidence_class: [PRIMARY_TEXT, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-INANA-DESCENT
        locator: "c.1.4.1 lines 404-410"
        relation: TEXTUAL_SCOPE_READBACK
        access_mode: ETCSL_TRANSLATION_AND_GLOSSING
    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DUMUZID-VEGETATION-DEITY-CONTESTED
    proposition: "The model of Dumuzid as fundamentally a vegetation deity is contested in modern scholarship; shepherding, kingship, netherworld office, and distinction from Damu/Ningishzida must remain available alternatives."
    claim_type: SCHOLARLY_MODEL_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SCH-MANDER-2005-DUMUZI
        locator: "discussion of Alster, Fritz, shepherding/kingship, and Damu/Ningishzida distinction"
        relation: SCHOLARLY_SYNTHESIS
        access_mode: REFERENCE_WORK
    opposing_sources: []
    confidence: high-for-contestation
    contested: true
    alternatives:
      - SHEPHERD_DEITY
      - ROYAL_KINGSHIP_FIGURE
      - NETHERWORLD_OFFICER
      - SYNCRETIC_VEGETATION_ASSOCIATION

  - id: CLM-DUMUZID-RISING-GOD-MODEL-CONTESTED
    proposition: "Treating Dumuzid as the dominant Mesopotamian dying-and-rising god prototype is contested by current scholarship; Ayali-Darshan 2024 argues that revival is scarcely attested in the Mesopotamian evidence and rejects a simple Dumuzi-prototype model for later West Asian traditions."
    claim_type: SCHOLARLY_MODEL_CONTROL
    evidence_class: [SCHOLARLY_INTERPRETATION]
    traditions: [sumerian, mesopotamian]
    supporting_sources:
      - source_id: SCH-AYALI-DARSHAN-2024-DYING-RISING
        locator: "publisher summary, findings, chapter 1"
        relation: CURRENT_SCHOLARLY_CHALLENGE
        access_mode: PUBLISHER_SUMMARY
    opposing_sources: []
    confidence: high-for-author-stated-thesis
    contested: true

  - id: CLM-DUMUZID-TEMPORARY-RELEASE-NOT-AUTOMATIC-RESURRECTION
    proposition: "A half-year release/alternation from the netherworld should not be normalized automatically as annual resurrection; periodic release, substitution, return, ritual movement, and resurrection are distinct semantic models."
    claim_type: SEMANTIC_MODEL_CONTROL
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
      - source_id: SRC-ETCSL-INANA-DESCENT
        locator: "c.1.4.1 lines 404-410"
        relation: PRIMARY_TEXT_BOUNDARY
        access_mode: ETCSL
      - source_id: SCH-AYALI-DARSHAN-2024-DYING-RISING
        locator: "discussion of limited revival evidence"
        relation: SCHOLARLY_MODEL_BOUNDARY
        access_mode: PUBLISHER_SUMMARY
    opposing_sources: []
    confidence: high-as-methodological-control
    contested: false

  - id: CLM-DUMUZID-SEASONAL-CORRELATION-PLAUSIBLE-NONEXPLICIT
    proposition: "Correlating Dumuzid's half-year alternation with seasonal or pastoral cycles remains a plausible scholarly interpretation, but it is not explicitly stated as the vegetation-cycle explanation in the half-year passage."
    claim_type: BOUNDED_SCHOLARLY_INTERPRETATION
    evidence_class: [PRIMARY_TEXT, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [sumerian]
    supporting_sources:
