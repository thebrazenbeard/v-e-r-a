    opposing_sources: []
    confidence: high
    contested: false

  - id: CLM-DUMUZID-DAMU-NINGISHZIDA-NOT-IDENTICAL
    proposition: "Dumuzid, Damu, and Ningishzida must not be treated as originally identical deities merely because later traditions or scholarship associate them; vegetation traits require source-specific attribution."
    claim_type: DEITY_IDENTITY_CONTROL
