  - id: CLM-DUMUZI-BAAL-DIFFERENT-ARCHIVES
    proposition: "The Dumuzi lexical witness RS 20.123+ belongs to the House of Rapanu archive context, whereas KTU 1.5-1.6 and the wider Baal Cycle are assigned to the House of the High Priest; the evidence therefore does not place the Dumuzi school tablet and Ilimilku's Baal tablets in one physical archive."
    claim_type: ARCHIVE_SEPARATION_CONTROL
    evidence_class: [MATERIAL_EVIDENCE, SCHOLARLY_INTERPRETATION, PROJECT_INFERENCE]
    traditions: [ugaritic, mesopotamian]
    supporting_sources:
